<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title layout:title-pattern="$CONTENT_TITLE · Pantry Tracker">Pantry Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.3/dist/htmx.min.js" defer></script>
    <style>
        :root {
            --pt-accent: #DB9558;
            --pt-bg: #FCF9EA;
            --pt-fresh: #97A87A;
            --pt-surface: #A8BBA3;
            --pt-text: #3A342B;
            --pt-warning: #C0562F;
        }
        body {
            background-color: var(--pt-bg);
            color: var(--pt-text);
        }
        .btn-pt {
            background-color: var(--pt-accent);
            border-color: var(--pt-accent);
            color: var(--pt-bg);
        }
        .btn-pt:hover,
        .btn-pt:focus {
            background-color: var(--pt-warning);
            border-color: var(--pt-warning);
            color: var(--pt-bg);
        }
        a {
            color: var(--pt-accent);
        }
        .card {
            background-color: var(--pt-bg);
            border-color: var(--pt-surface);
        }
        .pt-badge {
            color: var(--pt-bg);
        }
        .pt-badge-warning {
            background-color: var(--pt-warning);
        }
        .pt-badge-accent {
            background-color: var(--pt-accent);
        }
        .pt-badge-fresh {
            background-color: var(--pt-fresh);
        }
        .pt-badge-muted {
            background-color: var(--pt-surface);
            color: var(--pt-text);
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .pt-topbar {
            background-color: var(--pt-surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.7rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 1030;
            box-shadow: 0 1px 4px rgba(58, 52, 43, 0.12);
        }
        .pt-brand {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--pt-text);
            text-decoration: none;
            letter-spacing: -0.01em;
        }
        .pt-topbar-right {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.9rem;
            min-width: 0;
        }
        .pt-topbar-right .pt-user {
            max-width: 16rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pt-shell {
            display: flex;
            align-items: stretch;
            flex: 1 1 auto;
            min-height: 0;
        }
        .pt-sidebar {
            width: 232px;
            flex-shrink: 0;
            background-color: var(--pt-surface);
            display: flex;
            flex-direction: column;
            padding: 1.1rem 0.8rem;
        }
        .pt-nav {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            flex: 1 1 auto;
        }
        .pt-nav a {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.62rem 0.9rem;
            border-radius: 0.65rem;
            color: var(--pt-text);
            text-decoration: none;
            font-weight: 500;
            line-height: 1.1;
            transition: background-color 0.15s ease, transform 0.12s ease, color 0.15s ease;
        }
        .pt-nav a .pt-ico {
            font-size: 1.05rem;
            width: 1.4rem;
            text-align: center;
        }
        .pt-nav a:hover {
            background-color: rgba(219, 149, 88, 0.20);
            color: var(--pt-text);
            transform: translateX(3px);
        }
        .pt-nav a.active {
            background-color: var(--pt-accent);
            color: var(--pt-bg);
            box-shadow: 0 2px 6px rgba(58, 52, 43, 0.18);
        }
        .pt-nav a.active:hover {
            transform: none;
            background-color: var(--pt-accent);
            color: var(--pt-bg);
        }
        .pt-main {
            flex: 1 1 auto;
            min-width: 0;
            padding: 1.6rem 1.9rem;
        }
        @media (max-width: 767.98px) {
            .pt-shell {
                flex-direction: column;
            }
            .pt-sidebar {
                width: auto;
                flex-direction: row;
                align-items: center;
                gap: 0.5rem;
                overflow-x: auto;
                padding: 0.6rem 0.8rem;
            }
            .pt-nav {
                flex-direction: row;
                flex: 1 1 auto;
            }
            .pt-nav a:hover {
                transform: none;
            }
            .pt-main {
                padding: 1.1rem;
            }
        }
    </style>
</head>
<body>
<header class="pt-topbar">
    <a class="pt-brand" th:href="@{/}">🥫 Pantry Tracker</a>
    <div class="pt-topbar-right" sec:authorize="isAuthenticated()">
        <span class="pt-user" sec:authentication="name">user@example.com</span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-sm btn-outline-dark">Log out</button>
        </form>
    </div>
</header>
<div class="pt-shell">
    <aside class="pt-sidebar" sec:authorize="isAuthenticated()">
        <nav class="pt-nav">
            <a th:href="@{/}"><span class="pt-ico">🏠</span> Home</a>
            <a th:href="@{/grocery}"><span class="pt-ico">🛒</span> Grocery</a>
            <a th:href="@{/categories}"><span class="pt-ico">🏷️</span> Categories</a>
        </nav>
    </aside>
    <main class="pt-main">
        <div layout:fragment="content"></div>
    </main>
</div>
<script>
    document.body.addEventListener('htmx:configRequest', function (event) {
        var token = document.querySelector('meta[name="_csrf"]');
        var header = document.querySelector('meta[name="_csrf_header"]');
        if (token && header) {
            event.detail.headers[header.getAttribute('content')] = token.getAttribute('content');
        }
    });

    function ptApplyAutoCalc(checkbox) {
        var form = checkbox.form || checkbox.closest('form');
        if (!form) {
            return;
        }
        var dateInput = form.elements['expirationDate'];
        if (dateInput) {
            dateInput.disabled = checkbox.checked;
        }
    }

    function ptSyncAllAutoCalc() {
        document.querySelectorAll('.pt-autocalc').forEach(ptApplyAutoCalc);
    }

    function ptMarkActiveNav() {
        var path = window.location.pathname;
        document.querySelectorAll('.pt-nav a').forEach(function (a) {
            var href = a.getAttribute('href');
            var active = href === path || (href !== '/' && path.indexOf(href) === 0);
            a.classList.toggle('active', active);
        });
    }

    document.addEventListener('change', function (event) {
        if (event.target.classList.contains('pt-autocalc')) {
            ptApplyAutoCalc(event.target);
        }
    });

    document.addEventListener('DOMContentLoaded', function () {
        ptSyncAllAutoCalc();
        ptMarkActiveNav();
    });
    document.body.addEventListener('htmx:afterSwap', ptSyncAllAutoCalc);

    document.body.addEventListener('htmx:afterOnLoad', function (event) {
        var el = event.detail && event.detail.elt;
        if (!el || !el.closest) {
            return;
        }
        var modalEl = el.closest('.modal');
        if (modalEl && window.bootstrap) {
            bootstrap.Modal.getOrCreateInstance(modalEl).hide();
            var form = modalEl.querySelector('form');
            if (form) {
                form.reset();
            }
            ptSyncAllAutoCalc();
        }
    });
</script>
</body>
</html>
