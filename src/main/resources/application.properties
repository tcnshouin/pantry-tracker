spring.application.name=pantry-tracker

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pantry}
spring.datasource.username=${DB_USERNAME:pantry}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

pantry.expiring-soon-days=7
