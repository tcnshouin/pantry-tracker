<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title layout:title-pattern="$CONTENT_TITLE · Pantry Tracker">Pantry Tracker</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.3/dist/htmx.min.js" defer></script>
    <style>
        :root {
            --pt-bg: #FFFBE6;
            --pt-card: #FFFFFF;
            --pt-row: #FFFDF2;
            --pt-head: #EEF6EF;
            --pt-surface: #DDEEDF;
            --pt-text: #1F2A24;
            --pt-primary: #2F7D4F;
            --pt-primary-hover: #25643F;
            --pt-on-primary: #FFFFFF;
            --pt-accent: var(--pt-primary);
            --pt-soon: #F2B33D;
            --pt-soon-text: #1F2A24;
            --pt-warning: #C2410C;
            --pt-expired: #9B1C1C;
            --pt-fresh: #EEF6EF;
            --pt-fresh-text: #1F4D33;
            --pt-blue: var(--pt-primary);
            --pt-sky: var(--pt-surface);
            --pt-mint: var(--pt-surface);
            --pt-white: #FFFFFF;
            --pt-link: var(--pt-primary);
            --pt-line: #C9DECB;
            --pt-tint: rgba(47, 125, 79, 0.12);
            --pt-topbar-h: 3.5rem;
        }
        body {
            background-color: var(--pt-bg);
            color: var(--pt-text);
        }
        .btn-pt {
            background-color: var(--pt-primary);
            border-color: var(--pt-primary);
            color: var(--pt-on-primary);
        }
        .btn-pt:hover,
        .btn-pt:focus,
        .btn-pt:active {
            background-color: var(--pt-primary-hover);
            border-color: var(--pt-primary-hover);
            color: var(--pt-on-primary);
        }
        a {
            color: var(--pt-link);
        }
        .card {
            background-color: var(--pt-card);
            border: 0;
        }
        .card,
        .card.shadow-sm {
            box-shadow: 0 0.5rem 1.5rem rgba(31, 42, 36, 0.1) !important;
        }
        .card-header {
            position: relative;
            background: linear-gradient(180deg, #E3F0E5 0%, #F1F8F2 55%, var(--pt-card) 100%);
            border-bottom: 0;
        }
        .card-header::after,
        .pt-side-head::after {
            content: "";
            position: absolute;
            left: 1.25rem;
            right: 1.25rem;
            bottom: 0;
            height: 1px;
            background-color: var(--pt-line);
        }
        .form-check-input:checked,
        .form-check-input[type="checkbox"]:indeterminate {
            background-color: var(--pt-primary);
            border-color: var(--pt-primary);
        }
        .form-check-input:focus {
            border-color: var(--pt-primary);
            box-shadow: 0 0 0 0.2rem var(--pt-tint);
        }
        .form-switch .form-check-input:focus:not(:checked) {
            --bs-form-switch-bg: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 8 8'%3e%3ccircle r='3' fill='%232F7D4F'/%3e%3c/svg%3e");
        }
        .pt-badge {
            color: var(--pt-white);
        }
        .pt-badge-warning {
            background-color: var(--pt-warning);
        }
        .pt-badge-accent {
            background-color: var(--pt-soon);
            color: var(--pt-soon-text);
        }
        .pt-badge-fresh {
            background-color: var(--pt-fresh);
            color: var(--pt-fresh-text);
        }
        .pt-badge-muted {
            background-color: var(--pt-surface);
            color: var(--pt-text);
        }
        .pt-cat-badge {
            background-color: var(--pt-fresh);
            color: var(--pt-fresh-text);
        }
        .pt-more-btn {
            color: var(--pt-text);
            background-color: var(--pt-white);
            border: 1px solid var(--pt-line);
            line-height: 1;
            padding: 0.35rem 0.5rem;
        }
        .pt-more-btn:hover,
        .pt-more-btn:focus-visible,
        .pt-more-btn[aria-expanded="true"] {
            background-color: var(--pt-sky);
            border-color: var(--pt-blue);
            color: var(--pt-text);
        }
        .dropdown-menu {
            border-color: var(--pt-line);
            box-shadow: 0 6px 18px rgba(31, 42, 36, 0.14);
        }
        .dropdown-item {
            color: var(--pt-text);
        }
        .dropdown-item:hover,
        .dropdown-item:focus {
            background-color: var(--pt-tint);
            color: var(--pt-text);
        }
        .dropdown-item:active {
            background-color: var(--pt-sky);
            color: var(--pt-text);
        }
        .dropdown-item.text-danger:hover,
        .dropdown-item.text-danger:focus {
            background-color: #FDECEC;
            color: var(--pt-expired) !important;
        }
        .pt-icon-btn {
            color: var(--pt-link);
            background-color: transparent;
            border: 1px solid var(--pt-line);
            line-height: 1;
            padding: 0.35rem 0.5rem;
        }
        .pt-icon-btn:hover,
        .pt-icon-btn:focus-visible,
        .pt-icon-btn[aria-expanded="true"] {
            background-color: var(--pt-tint);
            border-color: var(--pt-primary);
            color: var(--pt-link);
        }
        .pt-exp-link {
            display: block;
            margin: -0.35rem -0.5rem;
            padding: 0.35rem 0.5rem;
            border-radius: 0.5rem;
            color: var(--pt-text);
            text-decoration: none;
            transition: background-color 0.15s ease;
        }
        .pt-exp-link:hover,
        .pt-exp-link:focus-visible {
            background-color: var(--pt-tint);
            color: var(--pt-text);
        }
        .pt-item-row {
            scroll-margin-top: calc(var(--pt-topbar-h) + 1rem);
            padding: 0.7rem 1rem !important;
        }
        .pt-item-row .pt-item-name {
            font-size: 1.08rem;
        }
        .pt-item-row .pt-cat-badge,
        .pt-item-row .pt-batches-toggle {
            font-size: 0.8rem;
        }
        .pt-item-row .pt-qty > .btn {
            padding: 0.3rem 0.6rem;
        }
        .pt-item-row.pt-flash {
            animation: pt-flash 1.6s ease-out;
        }
        @keyframes pt-flash {
            0%, 35% {
                box-shadow: 0 0 0 3px var(--pt-primary);
                background-color: var(--pt-head);
            }
            100% {
                box-shadow: 0 0 0 3px transparent;
            }
        }
        .pt-side-card {
            background: linear-gradient(0deg, #E3F0E5 0%, #F3F9F4 14%, var(--pt-card) 32%);
            display: flex;
            flex-direction: column;
            flex: 1 1 0;
            min-height: 0;
        }
        .pt-side-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.85rem calc(1.25rem + 6px);
            margin-bottom: 0.55rem;
            position: relative;
            padding-bottom: 0.95rem;
            background: linear-gradient(180deg, #E3F0E5 0%, #F1F8F2 55%, var(--pt-card) 100%);
            border-top-left-radius: var(--bs-card-border-radius);
            border-top-right-radius: var(--bs-card-border-radius);
        }
        .pt-shelf-icon {
            width: 1em;
            height: 1em;
            vertical-align: -0.125em;
        }
        .pt-head-text {
            position: relative;
            top: 2px;
        }
        .pt-head-text.pt-head-text-low {
            top: 3px;
        }
        .pt-side-head.pt-head-tight {
            background: linear-gradient(180deg, #E3F0E5 0%, #EBF4EC 30%, #F4F9F4 48%, var(--pt-card) 64%);
        }
        .pt-list-end {
            height: 1px;
            margin: 0.75rem 0.25rem 0.25rem;
            background-color: var(--pt-line);
        }
        .pt-list-end.pt-list-end-pad {
            margin: 0.35rem 1.25rem 0.85rem;
        }
        .pt-side-head > h2 {
            color: #28452F;
            font-weight: 700;
        }
        .pt-side-scroll {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 0 1.25rem 0.25rem;
            margin-bottom: 1rem;
            scrollbar-width: thin;
            scrollbar-color: var(--pt-line) transparent;
        }
        .pt-side-card.pt-side-fixed {
            flex: none;
        }
        .pt-side-card > .px-3 {
            padding-left: 1.25rem !important;
            padding-right: 1.25rem !important;
        }
        .pt-side-scroll .pt-list-end {
            margin-left: 0;
            margin-right: 0;
        }
        .pt-side-card.pt-fit-sized,
        .pt-side-card.pt-fit-sized .pt-side-scroll {
            flex: none;
        }
        .pt-loc-card .pt-side-scroll {
            padding: 0.4rem 1.4rem 0.6rem;
        }
        .pt-loc-card .pt-loc-link {
            padding: 0.75rem 0.95rem;
            font-size: 1.08rem;
        }
        .pt-loc-card .pt-loc-count {
            font-size: 0.8rem;
            min-width: 1.6rem;
        }
        .pt-loc-card .pt-loc-link.pt-loc-all {
            padding: 0.95rem 1.05rem;
            font-size: calc(1.08rem + 2px);
            font-weight: 600;
            margin-bottom: 0.5rem !important;
        }
        .pt-loc-card .pt-loc-link.pt-loc-all .bi {
            font-size: 1.15rem;
        }
        .pt-loc-card .pt-loc-link.pt-loc-all:not(.active) {
            background: linear-gradient(180deg, #F4FAF5 0%, #E7F2E9 100%);
            border: 1px solid rgba(255, 255, 255, 0.85);
            color: #28452F;
            box-shadow: 0 0.6rem 1.4rem rgba(31, 42, 36, 0.18), 0 0.15rem 0.4rem rgba(31, 42, 36, 0.1);
        }
        .pt-loc-card .pt-loc-link.pt-loc-all:not(.active):hover {
            background: linear-gradient(180deg, #FFFFFF 0%, #EEF6EF 100%);
            box-shadow: 0 0.75rem 1.6rem rgba(31, 42, 36, 0.22), 0 0.2rem 0.45rem rgba(31, 42, 36, 0.12);
        }
        .pt-loc-card > .px-3 {
            padding-left: 1.4rem !important;
            padding-right: 1.4rem !important;
        }
        .pt-exp-cards {
            padding: 0.3rem 0 0.2rem;
        }
        .pt-recent-list li {
            padding: 0.5rem 0;
        }
        .pt-recent-list .fw-semibold {
            font-size: 0.95rem;
        }
        .pt-recent-list .small {
            font-size: 0.78rem;
        }
        @media (min-width: 992px) and (max-height: 860px) {
            .pt-mini-stat {
                padding: 0.3rem 0.25rem;
            }
            .pt-mini-stat .h4 {
                font-size: 1.2rem;
            }
            .pt-side-card > .pt-summary-body {
                padding-bottom: 0.6rem;
            }
            .pt-side-head {
                padding-top: 0.6rem;
                padding-bottom: 0.7rem;
                margin-bottom: 0.4rem;
            }
            .pt-recent-list li {
                padding: 0.35rem 0 !important;
            }
            .pt-recent-list li:first-child {
                padding-top: 0 !important;
            }
            .pt-home-side {
                padding-top: calc(1.4rem + 8px) !important;
                padding-bottom: calc(1.4rem + 18px) !important;
                gap: 1rem !important;
            }
            .pt-home-main {
                padding-top: calc(1.4rem + 8px) !important;
                padding-bottom: calc(1.4rem + 18px) !important;
            }
            .pt-quick-btn {
                padding-top: 0.3rem;
                padding-bottom: 0.3rem;
            }
            .pt-side-card > .px-3 .form-control {
                margin-bottom: 0.35rem !important;
            }
        }
        @media (min-width: 992px) and (max-height: 719.98px) {
            .pt-home-side {
                position: static !important;
                height: auto !important;
                overflow: visible !important;
            }
            .pt-side-card {
                flex: none;
            }
            .pt-side-scroll {
                max-height: 15rem;
            }
        }
        .pt-summary-body {
            padding-left: 1.25rem !important;
            padding-right: 1.25rem !important;
            padding-bottom: calc(1rem + 12px);
        }
        .pt-stat-card {
            background: linear-gradient(180deg, #F0F7F1 0%, var(--pt-card) 28%, var(--pt-card) 62%, #F5FAF5 82%, #E6F1E8 100%);
        }
        .pt-stat-card > .card-body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-top: 1rem !important;
            padding-bottom: 1rem !important;
        }
        .pt-mini-stat {
            background-color: #D3E6D7;
            border-radius: 0.5rem;
            padding: 0.5rem 0.25rem;
        }
        .pt-quick-btn {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.28rem 0.5rem;
            line-height: 1.25;
            border: 0;
            border-radius: 0.5rem;
            background-color: transparent;
            color: var(--pt-text);
            transition: background-color 0.15s ease;
        }
        .pt-quick-plus {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 1.75rem;
            height: 1.75rem;
            border: 1.5px solid var(--pt-primary);
            border-radius: 50%;
            color: var(--pt-primary);
            font-size: 0.85rem;
            transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
        }
        .pt-quick-btn:hover .pt-quick-plus,
        .pt-quick-btn:focus-visible .pt-quick-plus {
            background-color: var(--pt-primary);
            color: var(--pt-white);
            box-shadow: 0 0.35rem 0.8rem rgba(47, 125, 79, 0.45);
            transform: scale(1.08);
        }
        .pt-quick-btn:hover,
        .pt-quick-btn:focus-visible {
            background-color: var(--pt-tint);
        }
        .pt-grocery-card {
            border-radius: 1rem;
            overflow: hidden;
        }
        .pt-grocery-row {
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            background-color: transparent;
            border-color: var(--pt-line);
        }
        .pt-grocery-row .pt-pick {
            flex-shrink: 0;
            width: 1.4rem;
            height: 1.4rem;
            margin: 0;
        }
        .pt-grocery-row .pt-grocery-title {
            font-size: 1.12rem;
            margin-bottom: 0.2rem;
        }
        .pt-grocery-row .badge {
            font-size: 0.78rem;
        }
        .pt-grocery-row .pt-qty > .btn {
            font-size: 1rem;
            padding: 0.35rem 0.75rem;
        }
        .pt-grocery-row .pt-qty > .pt-qty-value {
            min-width: 3.2rem;
        }
        .pt-grocery-row .pt-icon-btn {
            font-size: 1rem;
            padding: 0.5rem 0.65rem;
        }
        .pt-grocery-title {
            padding-left: 9px;
        }
        .pt-grocery-name {
            flex: 1 1 auto;
            min-width: 0;
            cursor: pointer;
        }
        .pt-grocery-row:has(.pt-pick:checked) {
            background-color: var(--pt-fresh);
        }
        .pt-grocery-card .pt-grocery-row {
            position: relative;
            border: 0;
        }
        .pt-grocery-card .pt-grocery-row + .pt-grocery-row::before {
            content: "";
            position: absolute;
            top: 0;
            left: 1.25rem;
            right: 1.25rem;
            height: 1px;
            background-color: var(--pt-line);
        }
        .modal-backdrop {
            --bs-backdrop-bg: #1F2A24;
            --bs-backdrop-opacity: 0.45;
        }
        .modal.show {
            backdrop-filter: blur(2px);
        }
        .pt-modal {
            position: relative;
            top: -30px;
        }
        .pt-modal.pt-modal-wide {
            max-width: 620px;
        }
        .pt-modal .modal-content {
            border: 7px solid #C3DCC7;
            border-radius: 1rem;
            background-color: var(--pt-card);
            box-shadow: 0 1.5rem 3.5rem rgba(31, 42, 36, 0.28), 0 0.35rem 1rem rgba(31, 42, 36, 0.14);
            overflow: hidden;
        }
        .pt-modal .modal-header {
            gap: 0.85rem;
            background-color: var(--pt-head);
            border-bottom: 1px solid var(--pt-line);
            padding: 1rem 1.5rem;
        }
        .pt-modal .modal-title {
            color: #28452F;
            font-weight: 700;
            font-size: 1.45rem;
        }
        .pt-modal-close {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 2.25rem;
            height: 2.25rem;
            border: 1px solid var(--pt-line);
            border-radius: 50%;
            background: linear-gradient(145deg, #FFFFFF 0%, #DDEEDF 55%, #B9D6BF 100%);
            color: #28452F;
            font-size: 0.95rem;
            box-shadow: 0 0.2rem 0.45rem rgba(31, 42, 36, 0.15);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .pt-modal-close:hover,
        .pt-modal-close:focus-visible {
            background: linear-gradient(145deg, #EEF6EF 0%, #B9D6BF 60%, #8FBF99 100%);
            box-shadow: 0 0.3rem 0.7rem rgba(31, 42, 36, 0.22);
            transform: scale(1.05);
        }
        .pt-stepper {
            display: flex;
            align-items: center;
            background-color: var(--pt-row);
            border: 1px solid var(--pt-line);
            border-radius: 0.6rem;
            overflow: hidden;
        }
        .pt-stepper:focus-within {
            background-color: var(--pt-white);
            border-color: var(--pt-primary);
            box-shadow: 0 0 0 0.2rem var(--pt-tint);
        }
        .pt-stepper .pt-step {
            border: 0;
            background: transparent;
            color: rgba(31, 42, 36, 0.6);
            font-size: 1.1rem;
            width: 2.6rem;
            align-self: stretch;
        }
        .pt-stepper .pt-step:hover {
            background-color: var(--pt-tint);
            color: #28452F;
        }
        .pt-stepper .pt-qty-input {
            flex: 1 1 auto;
            width: 100%;
            min-width: 0;
            border: 0;
            background: transparent;
            padding: 0.375rem 0;
            box-shadow: none;
        }
        .pt-stepper .pt-qty-input:focus {
            outline: none;
            box-shadow: none;
        }
        .pt-date {
            text-transform: uppercase;
        }
        .pt-date::-webkit-datetime-edit {
            text-transform: uppercase;
        }
        .pt-modal-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 2.6rem;
            height: 2.6rem;
            border-radius: 50%;
            background-color: var(--pt-primary);
            color: var(--pt-on-primary);
            font-size: 1.2rem;
            box-shadow: 0 0.25rem 0.6rem rgba(47, 125, 79, 0.35);
        }
        .pt-modal .modal-body {
            padding: 1.35rem 1.5rem 1.1rem;
        }
        .pt-modal .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }
        .pt-modal .form-control,
        .pt-modal .form-select {
            background-color: var(--pt-row);
            border-color: var(--pt-line);
            border-radius: 0.6rem;
        }
        .pt-modal .form-control:focus,
        .pt-modal .form-select:focus {
            background-color: var(--pt-white);
            border-color: var(--pt-primary);
            box-shadow: 0 0 0 0.2rem var(--pt-tint);
        }
        .pt-modal .form-control:disabled {
            background-color: var(--pt-surface);
            color: rgba(31, 42, 36, 0.55);
        }
        .pt-modal-option {
            background-color: var(--pt-fresh);
            border: 1px solid var(--pt-line);
            border-radius: 0.6rem;
            padding: 0.6rem 0.75rem 0.6rem 2.35rem;
        }
        .pt-modal .modal-footer {
            background-color: var(--pt-row);
            border-top: 1px solid var(--pt-line);
            padding: 0.85rem 1.5rem;
        }
        .pt-modal .modal-footer .btn {
            min-width: 6.5rem;
            border-radius: 0.6rem;
        }
        .pt-modal .modal-footer .btn-pt {
            background-color: #3A6B48;
            border-color: #3A6B48;
            box-shadow: 0 0.4rem 0.9rem rgba(58, 107, 72, 0.38);
        }
        .pt-modal .modal-footer .btn-pt:hover,
        .pt-modal .modal-footer .btn-pt:focus-visible {
            background-color: #2F5A3C;
            border-color: #2F5A3C;
            box-shadow: 0 0.55rem 1.2rem rgba(40, 69, 47, 0.45);
        }
        .pt-empty-art {
            width: 9rem;
            height: auto;
        }
        .pt-fresh-art {
            width: 4.5rem;
            height: auto;
        }
        .pt-empty-title {
            color: #28452F;
        }
        .pt-empty-text {
            max-width: 26rem;
        }
        .pt-all-table th {
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(31, 42, 36, 0.65);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border-bottom-color: var(--pt-line);
        }
        .pt-all-table td {
            border-color: var(--pt-line);
        }
        .pt-jump {
            cursor: pointer;
        }
        .pt-jump:hover > td,
        .pt-jump:focus-visible > td {
            background-color: var(--pt-tint);
        }
        .pt-dup {
            background-color: var(--pt-card);
            border: 1.5px solid #9DAFA2;

    </style>

<body>
<header class="pt-topbar">
    <div class="pt-topbar-left">
        <div class="pt-menu" sec:authorize="isAuthenticated()">
            <button type="button" class="pt-menu-btn" aria-label="Menu" aria-expanded="false"
                    aria-controls="pt-drawer"><i class="bi bi-list"></i></button>
            <aside class="pt-drawer" id="pt-drawer">
                <nav class="pt-nav">
                    <a th:href="@{/}" class="pt-nav-home"><i class="bi bi-house"></i> Home</a>
                    <a th:href="@{/grocery}"><i class="bi bi-cart3"></i> Grocery</a>
                    <a th:href="@{/categories}"><i class="bi bi-tags"></i> Categories</a>
                    <div class="pt-nav-end" aria-hidden="true"></div>
                </nav>
            </aside>
        </div>
        <a class="pt-brand" th:href="@{/}"><img class="pt-logo" th:src="@{/img/logo.png}" alt="">Pantry Tracker</a>
    </div>
    <div class="pt-topbar-right" sec:authorize="isAuthenticated()">
        <span class="pt-user" sec:authentication="name">user@example.com</span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-sm btn-outline-dark">Log out</button>
        </form>
    </div>
</header>
<main class="pt-main">
    <div layout:fragment="content"></div>
</main>
<div class="modal fade" id="pt-confirm" tabindex="-1" aria-hidden="true" aria-labelledby="pt-confirm-title">
    <div class="modal-dialog modal-dialog-centered pt-modal pt-confirm-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="pt-modal-icon pt-confirm-icon" aria-hidden="true"><i class="bi bi-trash3"></i></span>
                <div class="me-auto">
                    <h2 class="modal-title h5 mb-0" id="pt-confirm-title">Are you sure?</h2>
                    <div class="small text-muted" id="pt-confirm-note">This can't be undone.</div>
                </div>
                <button type="button" class="pt-modal-close" data-bs-dismiss="modal" aria-label="Close">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn pt-btn-danger" id="pt-confirm-ok"><i class="bi bi-trash3 me-1"></i>Delete</button>
            </div>
        </div>
    </div>
</div>
<script>
    var ptConfirmAction = null;

    function ptAskConfirm(question, note, onConfirm) {
        var el = document.getElementById('pt-confirm');
        if (!el || !window.bootstrap) {
            if (window.confirm(question)) {
                onConfirm();
            }
            return;
        }
        document.getElementById('pt-confirm-title').textContent = question;
        document.getElementById('pt-confirm-note').textContent = note || "This can't be undone.";
        ptConfirmAction = onConfirm;
        bootstrap.Modal.getOrCreateInstance(el).show();
    }

    document.addEventListener('click', function (event) {
        if (event.target.closest('#pt-confirm-ok')) {
            var action = ptConfirmAction;
            ptConfirmAction = null;
            bootstrap.Modal.getOrCreateInstance(document.getElementById('pt-confirm')).hide();
            if (action) {
                action();
            }
        }
    });

    document.addEventListener('submit', function (event) {
        var form = event.target;
        if (!form.dataset || !form.dataset.confirm || form.dataset.confirmed === 'yes') {
            return;
        }
        event.preventDefault();
        ptAskConfirm(form.dataset.confirm, form.dataset.confirmNote, function () {
            form.dataset.confirmed = 'yes';
            form.requestSubmit();
        });
    }, true);

    document.body.addEventListener('htmx:confirm', function (event) {
        if (!event.detail.question) {
            return;
        }
        event.preventDefault();
        ptAskConfirm(event.detail.question, event.detail.elt.dataset.confirmNote, function () {
            event.detail.issueRequest(true);
        });
    });

    document.body.addEventListener('htmx:configRequest', function (event) {
        var token = document.querySelector('meta[name="_csrf"]');
        var header = document.querySelector('meta[name="_csrf_header"]');
        if (token && header) {
            event.detail.headers[header.getAttribute('content')] = token.getAttribute('content');
        }
    });

    function ptApplyAutoCalc(checkbox) {
        var form = checkbox.form || checkbox.closest('form');
        if (!form) {
            return;
        }
        var dateInput = form.elements['expirationDate'];
        if (dateInput) {
            dateInput.disabled = checkbox.checked;
        }
    }

    function ptApplyCategoryRule(select) {
        var form = select.form;
        if (!form) {
            return;
        }
        var auto = form.querySelector('.pt-autocalc');
        var date = form.elements['expirationDate'];
        var hint = form.querySelector('.pt-manual-hint');
        var option = select.options[select.selectedIndex];
        var manual = !!option && option.dataset.manual === 'true';
        if (auto) {
            if (manual) {
                auto.checked = false;
            } else if (auto.disabled) {
                auto.checked = true;
            }
            auto.disabled = manual;
        }
        if (date) {
            date.required = manual;
        }
        if (hint) {
            hint.hidden = !manual;
        }
        if (auto) {
            ptApplyAutoCalc(auto);
        }
    }

    function ptInitTooltips(root) {
        if (!window.bootstrap) {
            return;
        }
        (root || document).querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (el) {
            bootstrap.Tooltip.getOrCreateInstance(el);
        });
    }

    document.body.addEventListener('htmx:beforeSwap', function () {
        document.querySelectorAll('.tooltip').forEach(function (tip) {
            tip.remove();
        });
    });

    document.body.addEventListener('htmx:afterSwap', function (event) {
        ptInitTooltips(event.detail && event.detail.target);
    });

    function ptFitLists() {
        var minFlexible = 170;
        document.querySelectorAll('.pt-home-side').forEach(function (side) {
            var cards = Array.prototype.slice.call(side.querySelectorAll('.pt-fit-card'));
            side.querySelectorAll('.pt-fit-card, .pt-side-card[data-min-rows]').forEach(function (card) {
                card.querySelector('.pt-side-scroll').style.height = '';
                card.querySelector('.pt-side-scroll').style.flex = '';
                card.classList.remove('pt-fit-sized');
            });
            if (window.innerWidth < 992 || window.innerHeight < 720) {
                return;
            }
            var plans = [];
            cards.forEach(function (card) {
                var count = parseInt(card.dataset.fit, 10) || 4;
                var scroll = card.querySelector('.pt-side-scroll');
                var items = card.querySelectorAll(card.dataset.fitItems || '.pt-fit-list > li');
                if (items.length < count) {
                    return;
                }
                card.classList.add('pt-fit-sized');
                var end = scroll.querySelector('.pt-list-end');
                plans.push({
                    k: count,
                    scroll: scroll,
                    heightFor: function (k) {
                        var top = scroll.getBoundingClientRect().top - scroll.scrollTop;
                        var last = items[k - 1].getBoundingClientRect().bottom;
                        if (!items[k] && end) {
                            last = end.getBoundingClientRect().bottom;
                        }
                        var next = items[k] ? items[k].getBoundingClientRect().top : last + 12;
                        return Math.round(last + (next - last) / 2 - top);
                    }
                });
            });
            plans.forEach(function (plan) {
                plan.target = plan.k;
                plan.scroll.style.height = plan.heightFor(plan.k) + 'px';
            });
            var style = getComputedStyle(side);
            var gap = parseFloat(style.rowGap) || 0;
            function overflow() {
                var inner = side.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
                var kids = Array.prototype.filter.call(side.children, function (c) {
                    return c.offsetParent !== null;
                });
                var used = gap * Math.max(0, kids.length - 1);
                kids.forEach(function (c) {
                    var sized = c.classList.contains('pt-fit-sized') || c.classList.contains('pt-side-fixed');
                    used += sized ? c.getBoundingClientRect().height : flexibleNeed(c);
                });
                return used - inner;
            }
            function flexibleNeed(card) {
                var rows = parseInt(card.dataset.minRows, 10);
                var scroll = card.querySelector('.pt-side-scroll');
                var items = card.dataset.minItems ? card.querySelectorAll(card.dataset.minItems) : [];
                if (!rows || !scroll || !items.length) {
                    return minFlexible;
                }
                var shown = items[Math.min(rows, items.length) - 1];
                var scrollRect = scroll.getBoundingClientRect();
                var fixed = card.getBoundingClientRect().height - scrollRect.height;
                var content = shown.getBoundingClientRect().bottom - scrollRect.top + scroll.scrollTop + 10;
                return Math.max(minFlexible, Math.ceil(fixed + content));
            }
            var guard = 30;
            while (overflow() > 0 && guard-- > 0) {
                var biggest = plans.filter(function (p) { return p.k > 1; })
                    .sort(function (a, b) { return b.k - a.k; })[0];
                if (!biggest) {
                    break;
                }
                biggest.k--;
                biggest.scroll.style.height = biggest.heightFor(biggest.k) + 'px';
            }
            var shrunk = plans.some(function (p) { return p.k < p.target; });
            if (shrunk) side.querySelectorAll('.pt-side-card[data-min-rows]').forEach(function (card) {
                var rows = parseInt(card.dataset.minRows, 10);
                var scroll = card.querySelector('.pt-side-scroll');
                var items = card.querySelectorAll(card.dataset.minItems);
                if (!rows || !scroll || items.length <= rows) {
                    return;
                }
                card.classList.add('pt-fit-sized');
                var top = scroll.getBoundingClientRect().top - scroll.scrollTop;
                var last = items[rows - 1].getBoundingClientRect().bottom;
                var next = items[rows].getBoundingClientRect().top;
                scroll.style.height = Math.round(last + (next - last) / 2 - top) + 'px';
            });
            if (shrunk) plans.slice().sort(function (a, b) { return a.k - b.k; }).forEach(function (plan) {
                while (plan.k < plan.target) {
                    plan.k++;
                    plan.scroll.style.height = plan.heightFor(plan.k) + 'px';
                    if (overflow() > 0) {
                        plan.k--;
                        plan.scroll.style.height = plan.heightFor(plan.k) + 'px';
                        break;
                    }
                }
            });
            side.querySelectorAll('.pt-side-card[data-min-rows]').forEach(function (card) {
                card.classList.remove('pt-fit-sized');
                var scroll = card.querySelector('.pt-side-scroll');
                scroll.style.height = '';
                scroll.style.flex = '';
                var items = card.querySelectorAll(card.dataset.minItems);
                var space = scroll.clientHeight;
                var top = scroll.getBoundingClientRect().top - scroll.scrollTop;
                var height = function (k) {
                    var last = items[k - 1].getBoundingClientRect().bottom;
                    var next = items[k] ? items[k].getBoundingClientRect().top : last + 8;
                    return Math.round(last + (next - last) / 2 - top);
                };
                var cap = parseInt(window.innerHeight >= 900 ? card.dataset.maxRows : card.dataset.maxRowsShort, 10)
                    || items.length;
                var k = 0;
                while (k < Math.min(cap, items.length) && height(k + 1) <= space) {
                    k++;
                }
                if (k < 1 || k >= items.length) {
                    return;
                }
                scroll.style.flex = 'none';
                scroll.style.height = height(k) + 'px';
            });
        });
    }

    window.addEventListener('resize', ptFitLists);
    document.body.addEventListener('htmx:afterSwap', ptFitLists);

    function ptSyncAllAutoCalc() {
        document.querySelectorAll('.pt-autocalc').forEach(ptApplyAutoCalc);
        document.querySelectorAll('form select[name="categoryId"]').forEach(function (select) {
            if (select.form && select.form.querySelector('.pt-autocalc')) {
                ptApplyCategoryRule(select);
            }
        });
    }

    function ptMarkActiveNav() {
        var path = window.location.pathname;
        document.querySelectorAll('.pt-nav a').forEach(function (a) {
            var href = a.getAttribute('href');
            var active = href === path || (href !== '/' && path.indexOf(href) === 0);
            a.classList.toggle('active', active);
        });
    }

    function ptSyncTopbarHeight() {
        var bar = document.querySelector('.pt-topbar');
        if (bar) {
            document.documentElement.style.setProperty('--pt-topbar-h', bar.offsetHeight + 'px');
        }
    }

    ptSyncTopbarHeight();
    window.addEventListener('resize', ptSyncTopbarHeight);
    window.addEventListener('load', ptSyncTopbarHeight);

    function ptGroupIdFromHash() {
        var match = window.location.hash.match(/^#group-card-(\d+|all)$/);
        return match ? match[1] : null;
    }

    function ptShowGroup(id) {
        var cards = Array.prototype.slice.call(document.querySelectorAll('.pt-group-card'));
        if (!cards.length) {
            return;
        }
        var target = cards.filter(function (c) { return c.dataset.groupId === String(id); })[0] || cards[0];
        var activeId = target.dataset.groupId;
        document.querySelector('.pt-home').classList.add('pt-one-group');
        cards.forEach(function (c) { c.classList.toggle('pt-active', c === target); });
        document.querySelectorAll('.pt-loc-link').forEach(function (a) {
            a.classList.toggle('active', a.dataset.groupId === activeId);
        });
        try {
            localStorage.setItem('pt-group', activeId);
        } catch (e) {
        }
        ptFitGroup();
    }

    function ptFitGroup() {
        document.querySelectorAll('.pt-group-card .pt-group-scroll').forEach(function (body) {
            body.style.maxHeight = '';
            body.style.removeProperty('--pt-row-gap');
            body.classList.remove('pt-group-fitted');
        });
        var card = document.querySelector('.pt-one-group .pt-group-card.pt-active:not(#group-card-all)');
        if (!card || window.innerWidth < 992 || window.innerHeight < 720) {
            return;
        }
        var body = card.querySelector('.pt-group-scroll');
        var rows = body ? body.querySelectorAll('.pt-item-row') : [];
        if (rows.length < 2) {
            return;
        }
        var first = rows[0].getBoundingClientRect();
        var pitch = rows[1].getBoundingClientRect().top - first.top;
        var gap = pitch - first.height;
        var bodyTop = body.getBoundingClientRect().top + window.scrollY;
        var padTop = first.top - body.getBoundingClientRect().top;
        var bottomSpace = (parseFloat(getComputedStyle(document.querySelector('.pt-home-main')).paddingBottom) || 24)
            + (parseFloat(getComputedStyle(card).marginBottom) || 0);
        var available = window.innerHeight - bodyTop - bottomSpace - padTop * 2;
        var fit = Math.floor((available + gap) / pitch);
        if (fit < 2 || fit >= rows.length) {
            return;
        }
        var extra = available - (fit * pitch - gap);
        var newGap = Math.min(gap + extra / (fit - 1), gap + 14);
        body.classList.add('pt-group-fitted');
        body.style.setProperty('--pt-row-gap', newGap + 'px');
        body.style.maxHeight = Math.floor(padTop + fit * (first.height + newGap) - newGap) + 'px';
    }

    window.addEventListener('resize', ptFitGroup);
    document.body.addEventListener('htmx:afterSwap', ptFitGroup);

    function ptInitGroups() {
        if (!document.querySelector('.pt-group-card')) {
            return;
        }
        var id = ptGroupIdFromHash();
        if (!id) {
            try {
                id = localStorage.getItem('pt-group');
            } catch (e) {
            }
        }
        ptShowGroup(id);
        if (ptGroupIdFromHash()) {
            window.scrollTo(0, 0);
        }
    }

    var ptAllStale = false;

    document.addEventListener('click', function (event) {
        var link = event.target.closest('.pt-loc-link');
        if (!link) {
            return;
        }
        event.preventDefault();
        history.replaceState(null, '', '#group-card-' + link.dataset.groupId);
        if (link.dataset.groupId === 'all' && ptAllStale) {
            window.location.reload();
            return;
        }
        ptShowGroup(link.dataset.groupId);
    });

    window.addEventListener('hashchange', function () {
        var id = ptGroupIdFromHash();
        if (id) {
            ptShowGroup(id);
        }
    });

    document.body.addEventListener('htmx:afterSwap', function (event) {
        var target = event.detail && event.detail.target;
        if (!target || !target.id || target.id.indexOf('group-body-') !== 0) {
            return;
        }
        ptAllStale = true;
        var groupId = target.id.substring('group-body-'.length);
        var link = document.querySelector('.pt-loc-link[data-group-id="' + groupId + '"] .pt-loc-count');
        if (link) {
            link.textContent = target.querySelectorAll('.pt-item-row').length;
        }
    });

    function ptSetMenu(open) {
        var menu = document.querySelector('.pt-menu');
        if (!menu) {
            return;
        }
        var btn = menu.querySelector('.pt-menu-btn');
        menu.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (!open && menu.contains(document.activeElement)) {
            document.activeElement.blur();
        }
    }

    document.addEventListener('click', function (event) {
        var menu = document.querySelector('.pt-menu');
        if (!menu) {
            return;
        }
        if (event.target.closest('.pt-menu-btn')) {
            ptSetMenu(!menu.classList.contains('open'));
        } else if (!menu.contains(event.target)) {
            ptSetMenu(false);
        }
    });

    document.addEventListener('click', function (event) {
        var step = event.target.closest('.pt-step');
        if (!step) {
            return;
        }
        var input = step.parentElement.querySelector('.pt-qty-input');
        var current = parseInt(input.value, 10) || 1;
        input.value = Math.max(1, current + parseInt(step.dataset.step, 10));
    });

    document.addEventListener('click', function (event) {
        var link = event.target.closest('.pt-exp-link, .pt-jump');
        if (!link) {
            return;
        }
        event.preventDefault();
        history.replaceState(null, '', '#group-card-' + link.dataset.groupId);
        ptShowGroup(link.dataset.groupId);
        var row = document.getElementById('item-row-' + link.dataset.itemId);
        if (!row) {
            return;
        }
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        row.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
        if (!reduce) {
            row.classList.remove('pt-flash');
            void row.offsetWidth;
            row.classList.add('pt-flash');
        }
    });

    document.addEventListener('input', function (event) {
        if (event.target.id !== 'loc-search') {
            return;
        }
        var term = event.target.value.trim().toLowerCase();
        var shown = 0;
        document.querySelectorAll('#loc-list > li').forEach(function (li) {
            var name = li.querySelector('.pt-loc-name').textContent.toLowerCase();
            var match = name.indexOf(term) !== -1;
            li.hidden = !match;
            if (match) {
                shown++;
            }
        });
        var none = document.getElementById('loc-no-match');
        if (none) {
            none.hidden = shown > 0;
        }
    });

    document.addEventListener('shown.bs.collapse', function (event) {
        var field = event.target.querySelector('input');
        if (field && (event.target.id === 'loc-search-box' || event.target.id === 'new-location')) {
            field.focus();
        }
    });

    function ptSyncPutAway() {
        var picks = Array.prototype.slice.call(document.querySelectorAll('.pt-pick:not(:disabled)'));
        var btn = document.getElementById('put-away-btn');
        if (!btn) {
            return;
        }
        var checked = picks.filter(function (p) { return p.checked; }).length;
        document.getElementById('put-away-count').textContent = checked;
        btn.disabled = checked === 0;
        var all = document.getElementById('pick-all');
        all.checked = picks.length > 0 && checked === picks.length;
        all.indeterminate = checked > 0 && checked < picks.length;
    }

    function ptFilterQuickAdd() {
        var field = document.getElementById('quick-search');
        if (!field) {
            return;
        }
        var term = field.value.trim().toLowerCase();
        var shown = 0;
        document.querySelectorAll('#quick-list > li').forEach(function (li) {
            var match = li.querySelector('.pt-quick-name').textContent.toLowerCase().indexOf(term) !== -1;
            li.hidden = !match;
            if (match) {
                shown++;
            }
        });
        var none = document.getElementById('quick-no-match');
        if (none) {
            none.hidden = shown > 0 || !document.getElementById('quick-list');
        }
    }

    document.addEventListener('change', function (event) {
        if (event.target.id === 'pick-all') {
            document.querySelectorAll('.pt-pick:not(:disabled)').forEach(function (p) {
                p.checked = event.target.checked;
            });
        }
        if (event.target.id === 'pick-all' || event.target.classList.contains('pt-pick')) {
            ptSyncPutAway();
        }
    });

    document.addEventListener('click', function (event) {
        var chip = event.target.closest('.pt-select-all');
        if (!chip || event.target.closest('input, label')) {
            return;
        }
        var box = chip.querySelector('input');
        box.checked = !box.checked;
        box.dispatchEvent(new Event('change', { bubbles: true }));
    });

    document.addEventListener('input', function (event) {
        if (event.target.id === 'quick-search') {
            ptFilterQuickAdd();
        }
    });

    var ptGroceryState = null;

    document.body.addEventListener('htmx:beforeSwap', function (event) {
        if (event.detail.target.id !== 'grocery-body') {
            return;
        }
        var search = document.getElementById('quick-search');
        ptGroceryState = {
            picked: Array.prototype.map.call(document.querySelectorAll('.pt-pick:checked'), function (p) { return p.value; }),
            search: search ? search.value : '',
            focus: search === document.activeElement
        };
    });

    document.body.addEventListener('htmx:afterSwap', function (event) {
        if (event.detail.target.id !== 'grocery-body' || !ptGroceryState) {
            return;
        }
        ptGroceryState.picked.forEach(function (id) {
            var box = document.getElementById('pick-' + id);
            if (box && !box.disabled) {
                box.checked = true;
            }
        });
        var search = document.getElementById('quick-search');
        if (search) {
            search.value = ptGroceryState.search;
            if (ptGroceryState.focus) {
                search.focus();
            }
        }
        ptGroceryState = null;
        ptFilterQuickAdd();
        ptSyncPutAway();
    });

    var ptToastTimer = null;

    function ptShowToast(toast) {
        if (!toast) {
            return;
        }
        document.querySelectorAll('.pt-undo-toast').forEach(function (t) {
            if (t !== toast) {
                t.remove();
            }
        });
        document.body.appendChild(toast);
        clearTimeout(ptToastTimer);
        ptToastTimer = setTimeout(function () { toast.remove(); }, 12000);
    }

    document.addEventListener('DOMContentLoaded', function () {
        var toasts = document.querySelectorAll('.pt-undo-toast');
        ptShowToast(toasts[toasts.length - 1]);
    });

    document.body.addEventListener('htmx:afterSwap', function (event) {
        var target = event.detail && event.detail.target;
        if (target && target.querySelector) {
            ptShowToast(target.querySelector('.pt-undo-toast'));
        }
    });

    document.addEventListener('click', function (event) {
        var close = event.target.closest('.pt-undo-close');
        if (close) {
            close.closest('.pt-undo-toast').remove();
        }
    });

    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
            ptSetMenu(false);
        }
    });

    document.addEventListener('change', function (event) {
        if (event.target.classList.contains('pt-autocalc')) {
            ptApplyAutoCalc(event.target);
        }
        if (event.target.name === 'categoryId' && event.target.form
                && event.target.form.querySelector('.pt-autocalc')) {
            ptApplyCategoryRule(event.target);
        }
    });

    document.addEventListener('DOMContentLoaded', function () {
        ptSyncAllAutoCalc();
        ptMarkActiveNav();
        ptInitGroups();
        ptInitTooltips();
        ptFitLists();
        ptSyncPutAway();
    });
    document.body.addEventListener('htmx:afterSwap', ptSyncAllAutoCalc);

    document.body.addEventListener('htmx:afterOnLoad', function (event) {
        var el = event.detail && event.detail.elt;
        if (!el || !el.closest) {
            return;
        }
        var modalEl = el.closest('.modal');
        if (modalEl && window.bootstrap) {
            bootstrap.Modal.getOrCreateInstance(modalEl).hide();
            var form = modalEl.querySelector('form');
            if (form) {
                form.reset();
            }
            ptSyncAllAutoCalc();
        }
    });
</script>
</body>
</html>
