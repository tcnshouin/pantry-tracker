<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title layout:title-pattern="$CONTENT_TITLE · Pantry Tracker">Pantry Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.3/dist/htmx.min.js" defer></script>
    <style>
        :root {
            --pt-accent: #DB9558;
            --pt-bg: #FCF9EA;
            --pt-fresh: #97A87A;
            --pt-surface: #A8BBA3;
            --pt-text: #3A342B;
            --pt-warning: #C0562F;
            --pt-topbar-h: 3.5rem;
        }
        body {
            background-color: var(--pt-bg);
            color: var(--pt-text);
        }
        .btn-pt {
            background-color: var(--pt-accent);
            border-color: var(--pt-accent);
            color: var(--pt-bg);
        }
        .btn-pt:hover,
        .btn-pt:focus {
            background-color: var(--pt-warning);
            border-color: var(--pt-warning);
            color: var(--pt-bg);
        }
        a {
            color: var(--pt-accent);
        }
        .card {
            background-color: var(--pt-bg);
            border-color: var(--pt-surface);
        }
        .pt-badge {
            color: var(--pt-bg);
        }
        .pt-badge-warning {
            background-color: var(--pt-warning);
        }
        .pt-badge-accent {
            background-color: var(--pt-accent);
        }
        .pt-badge-fresh {
            background-color: var(--pt-fresh);
        }
        .pt-badge-muted {
            background-color: var(--pt-surface);
            color: var(--pt-text);
        }
        .pt-loc-link {
            color: var(--pt-text);
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 0.7rem;
            border-radius: 0.55rem;
            transition: background-color 0.15s ease, color 0.15s ease;
        }
        .pt-loc-link:hover {
            background-color: rgba(219, 149, 88, 0.18);
            color: var(--pt-text);
        }
        .pt-loc-link.active {
            background-color: var(--pt-accent);
            color: var(--pt-bg);
        }
        .pt-loc-link.active .pt-loc-count {
            background-color: var(--pt-bg);
            color: var(--pt-text);
        }
        .pt-one-group .pt-group-card:not(.pt-active) {
            display: none;
        }
        .pt-group-card {
            scroll-margin-top: calc(var(--pt-topbar-h) + 1rem);
        }
        .pt-main:has(> .pt-home) {
            padding: 0;
        }
        .pt-home {
            display: flex;
            align-items: flex-start;
            min-height: calc(100vh - var(--pt-topbar-h));
        }
        .pt-home-side {
            width: 380px;
            flex-shrink: 0;
            position: sticky;
            top: var(--pt-topbar-h);
            height: calc(100vh - var(--pt-topbar-h));
            overflow-y: auto;
            padding: 1.6rem 0.5rem 1.6rem 1.9rem;
        }
        .pt-home-main {
            flex: 1 1 auto;
            min-width: 0;
            padding: 1.6rem 1.9rem 1.6rem 0.5rem;
        }
        @media (max-width: 991.98px) {
            .pt-home {
                flex-direction: column;
                align-items: stretch;
            }
            .pt-home-side {
                width: auto;
                position: static;
                height: auto;
                overflow: visible;
                padding: 1.1rem 1.1rem 0;
            }
            .pt-home-main {
                padding: 1.1rem;
            }
        }
        .pt-expiry {
            color: var(--pt-text);
            opacity: 0.75;
            white-space: nowrap;
        }
        .pt-expiry-past {
            color: var(--pt-warning);
            opacity: 1;
            font-weight: 600;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .pt-topbar {
            background-color: var(--pt-surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.7rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 1030;
            box-shadow: 0 1px 4px rgba(58, 52, 43, 0.12);
        }
        .pt-brand {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--pt-text);
            text-decoration: none;
            letter-spacing: -0.01em;
        }
        .pt-topbar-right {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.9rem;
            min-width: 0;
        }
        .pt-topbar-right .pt-user {
            max-width: 16rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pt-topbar-left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            align-self: stretch;
        }
        .pt-menu {
            align-self: stretch;
            display: flex;
            align-items: center;
            margin: -0.7rem 0;
            padding: 0.7rem 0;
        }
        .pt-menu-btn {
            background: none;
            border: 0;
            color: var(--pt-text);
            font-size: 1.5rem;
            line-height: 1;
            padding: 0.25rem 0.45rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .pt-menu-btn:hover,
        .pt-menu-btn:focus-visible,
        .pt-menu.open .pt-menu-btn {
            background-color: rgba(252, 249, 234, 0.45);
        }
        .pt-drawer {
            position: absolute;
            top: 100%;
            left: 0;
            width: 236px;
            height: calc(100vh - 100%);
            background-color: var(--pt-surface);
            box-shadow: 4px 0 14px rgba(58, 52, 43, 0.18);
            padding: 1.2rem 0.8rem;
            transform: translateX(-100%);
            visibility: hidden;
            transition: transform 0.22s ease, visibility 0s linear 0.22s;
        }
        .pt-menu:hover .pt-drawer,
        .pt-menu:focus-within .pt-drawer,
        .pt-menu.open .pt-drawer {
            transform: translateX(0);
            visibility: visible;
            transition: transform 0.22s ease, visibility 0s;
        }
        .pt-nav {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .pt-nav a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.65rem 0.95rem;
            border-radius: 0.65rem;
            color: var(--pt-text);
            text-decoration: none;
            font-weight: 500;
            line-height: 1.1;
            white-space: nowrap;
            transition: background-color 0.15s ease, transform 0.12s ease, color 0.15s ease;
        }
        .pt-nav a .bi {
            font-size: 1.15rem;
            width: 1.3rem;
            text-align: center;
        }
        .pt-nav a:hover {
            background-color: rgba(219, 149, 88, 0.20);
            color: var(--pt-text);
            transform: translateX(3px);
        }
        .pt-nav a.active {
            background-color: var(--pt-accent);
            color: var(--pt-bg);
            box-shadow: 0 2px 6px rgba(58, 52, 43, 0.18);
        }
        .pt-nav a.active:hover {
            transform: none;
            background-color: var(--pt-accent);
            color: var(--pt-bg);
        }
        .pt-main {
            flex: 1 1 auto;
            min-width: 0;
            padding: 1.6rem 1.9rem;
        }
        @media (max-width: 767.98px) {
            .pt-topbar {
                padding: 0.7rem 1rem;
            }
            .pt-topbar-right .pt-user {
                display: none;
            }
            .pt-nav a:hover {
                transform: none;
            }
            .pt-main {
                padding: 1.1rem;
            }
        }
    </style>
</head>
<body>
<header class="pt-topbar">
    <div class="pt-topbar-left">
        <div class="pt-menu" sec:authorize="isAuthenticated()">
            <button type="button" class="pt-menu-btn" aria-label="Menu" aria-expanded="false"
                    aria-controls="pt-drawer"><i class="bi bi-list"></i></button>
            <aside class="pt-drawer" id="pt-drawer">
                <nav class="pt-nav">
                    <a th:href="@{/}"><i class="bi bi-house"></i> Home</a>
                    <a th:href="@{/grocery}"><i class="bi bi-cart3"></i> Grocery</a>
                    <a th:href="@{/categories}"><i class="bi bi-tags"></i> Categories</a>
                </nav>
            </aside>
        </div>
        <a class="pt-brand" th:href="@{/}">🥫 Pantry Tracker</a>
    </div>
    <div class="pt-topbar-right" sec:authorize="isAuthenticated()">
        <span class="pt-user" sec:authentication="name">user@example.com</span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-sm btn-outline-dark">Log out</button>
        </form>
    </div>
</header>
<main class="pt-main">
    <div layout:fragment="content"></div>
</main>
<script>
    document.body.addEventListener('htmx:configRequest', function (event) {
        var token = document.querySelector('meta[name="_csrf"]');
        var header = document.querySelector('meta[name="_csrf_header"]');
        if (token && header) {
            event.detail.headers[header.getAttribute('content')] = token.getAttribute('content');
        }
    });

    function ptApplyAutoCalc(checkbox) {
        var form = checkbox.form || checkbox.closest('form');
        if (!form) {
            return;
        }
        var dateInput = form.elements['expirationDate'];
        if (dateInput) {
            dateInput.disabled = checkbox.checked;
        }
    }

    function ptSyncAllAutoCalc() {
        document.querySelectorAll('.pt-autocalc').forEach(ptApplyAutoCalc);
    }

    function ptMarkActiveNav() {
        var path = window.location.pathname;
        document.querySelectorAll('.pt-nav a').forEach(function (a) {
            var href = a.getAttribute('href');
            var active = href === path || (href !== '/' && path.indexOf(href) === 0);
            a.classList.toggle('active', active);
        });
    }

    function ptSyncTopbarHeight() {
        var bar = document.querySelector('.pt-topbar');
        if (bar) {
            document.documentElement.style.setProperty('--pt-topbar-h', bar.offsetHeight + 'px');
        }
    }

    ptSyncTopbarHeight();
    window.addEventListener('resize', ptSyncTopbarHeight);
    window.addEventListener('load', ptSyncTopbarHeight);

    function ptGroupIdFromHash() {
        var match = window.location.hash.match(/^#group-card-(\d+)$/);
        return match ? match[1] : null;
    }

    function ptShowGroup(id) {
        var cards = Array.prototype.slice.call(document.querySelectorAll('.pt-group-card'));
        if (!cards.length) {
            return;
        }
        var target = cards.filter(function (c) { return c.dataset.groupId === String(id); })[0] || cards[0];
        var activeId = target.dataset.groupId;
        document.querySelector('.pt-home').classList.add('pt-one-group');
        cards.forEach(function (c) { c.classList.toggle('pt-active', c === target); });
        document.querySelectorAll('.pt-loc-link').forEach(function (a) {
            a.classList.toggle('active', a.dataset.groupId === activeId);
        });
        try {
            localStorage.setItem('pt-group', activeId);
        } catch (e) {
        }
    }

    function ptInitGroups() {
        if (!document.querySelector('.pt-group-card')) {
            return;
        }
        var id = ptGroupIdFromHash();
        if (!id) {
            try {
                id = localStorage.getItem('pt-group');
            } catch (e) {
            }
        }
        ptShowGroup(id);
        if (ptGroupIdFromHash()) {
            window.scrollTo(0, 0);
        }
    }

    document.addEventListener('click', function (event) {
        var link = event.target.closest('.pt-loc-link');
        if (!link) {
            return;
        }
        event.preventDefault();
        history.replaceState(null, '', '#group-card-' + link.dataset.groupId);
        ptShowGroup(link.dataset.groupId);
    });

    window.addEventListener('hashchange', function () {
        var id = ptGroupIdFromHash();
        if (id) {
            ptShowGroup(id);
        }
    });

    document.body.addEventListener('htmx:afterSwap', function (event) {
        var target = event.detail && event.detail.target;
        if (!target || !target.id || target.id.indexOf('group-body-') !== 0) {
            return;
        }
        var groupId = target.id.substring('group-body-'.length);
        var link = document.querySelector('.pt-loc-link[data-group-id="' + groupId + '"] .pt-loc-count');
        if (link) {
            link.textContent = target.querySelectorAll('.pt-item-row').length;
        }
    });

    function ptSetMenu(open) {
        var menu = document.querySelector('.pt-menu');
        if (!menu) {
            return;
        }
        var btn = menu.querySelector('.pt-menu-btn');
        menu.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (!open && menu.contains(document.activeElement)) {
            document.activeElement.blur();
        }
    }

    document.addEventListener('click', function (event) {
        var menu = document.querySelector('.pt-menu');
        if (!menu) {
            return;
        }
        if (event.target.closest('.pt-menu-btn')) {
            ptSetMenu(!menu.classList.contains('open'));
        } else if (!menu.contains(event.target)) {
            ptSetMenu(false);
        }
    });

    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
            ptSetMenu(false);
        }
    });

    document.addEventListener('change', function (event) {
        if (event.target.classList.contains('pt-autocalc')) {
            ptApplyAutoCalc(event.target);
        }
    });

    document.addEventListener('DOMContentLoaded', function () {
        ptSyncAllAutoCalc();
        ptMarkActiveNav();
        ptInitGroups();
    });
    document.body.addEventListener('htmx:afterSwap', ptSyncAllAutoCalc);

    document.body.addEventListener('htmx:afterOnLoad', function (event) {
        var el = event.detail && event.detail.elt;
        if (!el || !el.closest) {
            return;
        }
        var modalEl = el.closest('.modal');
        if (modalEl && window.bootstrap) {
            bootstrap.Modal.getOrCreateInstance(modalEl).hide();
            var form = modalEl.querySelector('form');
            if (form) {
                form.reset();
            }
            ptSyncAllAutoCalc();
        }
    });
</script>
</body>
</html>
