<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title layout:title-pattern="$CONTENT_TITLE · Pantry Tracker">Pantry Tracker</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.3/dist/htmx.min.js" defer></script>
    <style>
        :root {
            --pt-bg: #FFFBE6;
            --pt-card: #FFFFFF;
            --pt-row: #FFFDF2;
            --pt-head: #EEF6EF;
            --pt-surface: #DDEEDF;
            --pt-text: #1F2A24;
            --pt-primary: #2F7D4F;
            --pt-primary-hover: #25643F;
            --pt-on-primary: #FFFFFF;
            --pt-accent: var(--pt-primary);
            --pt-soon: #F2B33D;
            --pt-soon-text: #1F2A24;
            --pt-warning: #C2410C;
            --pt-expired: #9B1C1C;
            --pt-fresh: #EEF6EF;
            --pt-fresh-text: #1F4D33;
            --pt-blue: var(--pt-primary);
            --pt-sky: var(--pt-surface);
            --pt-mint: var(--pt-surface);
            --pt-white: #FFFFFF;
            --pt-link: var(--pt-primary);
            --pt-line: #C9DECB;
            --pt-tint: rgba(47, 125, 79, 0.12);
            --pt-topbar-h: 3.5rem;
        }
        body {
            background-color: var(--pt-bg);
            color: var(--pt-text);
        }
        .btn-pt {
            background-color: var(--pt-primary);
            border-color: var(--pt-primary);
            color: var(--pt-on-primary);
        }
        .btn-pt:hover,
        .btn-pt:focus,
        .btn-pt:active {
            background-color: var(--pt-primary-hover);
            border-color: var(--pt-primary-hover);
            color: var(--pt-on-primary);
        }
        a {
            color: var(--pt-link);
        }
        .card {
            background-color: var(--pt-card);
            border-color: var(--pt-line);
        }
        .card-header {
            background-color: var(--pt-head);
            border-bottom-color: var(--pt-line);
        }
        .form-check-input:checked {
            background-color: var(--pt-primary);
            border-color: var(--pt-primary);
        }
        .pt-badge {
            color: var(--pt-white);
        }
        .pt-badge-warning {
            background-color: var(--pt-warning);
        }
        .pt-badge-accent {
            background-color: var(--pt-soon);
            color: var(--pt-soon-text);
        }
        .pt-badge-fresh {
            background-color: var(--pt-fresh);
            color: var(--pt-fresh-text);
        }
        .pt-badge-muted {
            background-color: var(--pt-surface);
            color: var(--pt-text);
        }
        .pt-cat-badge {
            background-color: var(--pt-fresh);
            color: var(--pt-fresh-text);
        }
        .pt-more-btn {
            color: var(--pt-text);
            background-color: var(--pt-white);
            border: 1px solid var(--pt-line);
            line-height: 1;
            padding: 0.35rem 0.5rem;
        }
        .pt-more-btn:hover,
        .pt-more-btn:focus-visible,
        .pt-more-btn[aria-expanded="true"] {
            background-color: var(--pt-sky);
            border-color: var(--pt-blue);
            color: var(--pt-text);
        }
        .dropdown-menu {
            border-color: var(--pt-line);
            box-shadow: 0 6px 18px rgba(31, 42, 36, 0.14);
        }
        .dropdown-item {
            color: var(--pt-text);
        }
        .dropdown-item:hover,
        .dropdown-item:focus {
            background-color: var(--pt-tint);
            color: var(--pt-text);
        }
        .dropdown-item:active {
            background-color: var(--pt-sky);
            color: var(--pt-text);
        }
        .dropdown-item.text-danger:hover,
        .dropdown-item.text-danger:focus {
            background-color: #FDECEC;
            color: var(--pt-expired) !important;
        }
        .pt-icon-btn {
            color: var(--pt-link);
            background-color: transparent;
            border: 1px solid var(--pt-line);
            line-height: 1;
            padding: 0.35rem 0.5rem;
        }
        .pt-icon-btn:hover,
        .pt-icon-btn:focus-visible,
        .pt-icon-btn[aria-expanded="true"] {
            background-color: var(--pt-tint);
            border-color: var(--pt-primary);
            color: var(--pt-link);
        }
        .pt-exp-link {
            display: block;
            margin: -0.35rem -0.5rem;
            padding: 0.35rem 0.5rem;
            border-radius: 0.5rem;
            color: var(--pt-text);
            text-decoration: none;
            transition: background-color 0.15s ease;
        }
        .pt-exp-link:hover,
        .pt-exp-link:focus-visible {
            background-color: var(--pt-tint);
            color: var(--pt-text);
        }
        .pt-item-row {
            scroll-margin-top: calc(var(--pt-topbar-h) + 1rem);
        }
        .pt-item-row.pt-flash {
            animation: pt-flash 1.6s ease-out;
        }
        @keyframes pt-flash {
            0%, 35% {
                box-shadow: 0 0 0 3px var(--pt-primary);
                background-color: var(--pt-head);
            }
            100% {
                box-shadow: 0 0 0 3px transparent;
            }
        }
        .pt-side-card {
            display: flex;
            flex-direction: column;
            flex: 1 1 0;
            min-height: 0;
        }
        .pt-side-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 1rem 1rem 0.75rem;
        }
        .pt-side-scroll {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 0 1rem 0.25rem;
            margin-bottom: 1rem;
            scrollbar-width: thin;
            scrollbar-color: var(--pt-line) transparent;
        }
        .pt-side-card.pt-side-fixed {
            flex: none;
        }
        .pt-mini-stat {
            background-color: var(--pt-head);
            border-radius: 0.5rem;
            padding: 0.5rem 0.25rem;
        }
        .pt-quick-btn {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.45rem 0.5rem;
            border: 0;
            border-radius: 0.5rem;
            background-color: transparent;
            color: var(--pt-text);
            transition: background-color 0.15s ease;
        }
        .pt-quick-btn .bi {
            color: var(--pt-link);
            font-size: 1.1rem;
        }
        .pt-quick-btn:hover,
        .pt-quick-btn:focus-visible {
            background-color: var(--pt-tint);
        }
        .pt-grocery-row {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            background-color: transparent;
            border-color: var(--pt-line);
        }
        .pt-grocery-row .pt-pick {
            flex-shrink: 0;
            width: 1.2rem;
            height: 1.2rem;
            margin: 0;
        }
        .pt-grocery-name {
            flex: 1 1 auto;
            min-width: 0;
            cursor: pointer;
        }
        .pt-grocery-row:has(.pt-pick:checked) {
            background-color: var(--pt-fresh);
        }
        .modal-backdrop {
            --bs-backdrop-bg: #1F2A24;
            --bs-backdrop-opacity: 0.45;
        }
        .modal.show {
            backdrop-filter: blur(2px);
        }
        .pt-modal {
            position: relative;
            top: -30px;
        }
        .pt-modal .modal-content {
            border: 3px solid #1B3324;
            border-radius: 1rem;
            background-color: var(--pt-card);
            box-shadow: 0 1.5rem 3.5rem rgba(31, 42, 36, 0.28), 0 0.35rem 1rem rgba(31, 42, 36, 0.14);
            overflow: hidden;
        }
        .pt-modal .modal-header {
            gap: 0.85rem;
            background-color: var(--pt-head);
            border-top: 4px solid var(--pt-primary);
            border-bottom: 1px solid var(--pt-line);
            padding: 1rem 1.5rem;
        }
        .pt-modal .modal-title {
            color: #28452F;
            font-weight: 700;
        }
        .pt-modal-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 2.6rem;
            height: 2.6rem;
            border-radius: 50%;
            background-color: var(--pt-primary);
            color: var(--pt-on-primary);
            font-size: 1.2rem;
            box-shadow: 0 0.25rem 0.6rem rgba(47, 125, 79, 0.35);
        }
        .pt-modal .modal-body {
            padding: 1.35rem 1.5rem 1.1rem;
        }
        .pt-modal .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }
        .pt-modal .form-control,
        .pt-modal .form-select {
            background-color: var(--pt-row);
            border-color: var(--pt-line);
            border-radius: 0.6rem;
        }
        .pt-modal .form-control:focus,
        .pt-modal .form-select:focus {
            background-color: var(--pt-white);
            border-color: var(--pt-primary);
            box-shadow: 0 0 0 0.2rem var(--pt-tint);
        }
        .pt-modal .form-control:disabled {
            background-color: var(--pt-surface);
            color: rgba(31, 42, 36, 0.55);
        }
        .pt-modal-option {
            background-color: var(--pt-fresh);
            border: 1px solid var(--pt-line);
            border-radius: 0.6rem;
            padding: 0.6rem 0.75rem 0.6rem 2.35rem;
        }
        .pt-modal .modal-footer {
            background-color: var(--pt-row);
            border-top: 1px solid var(--pt-line);
            padding: 0.85rem 1.5rem;
        }
        .pt-modal .modal-footer .btn {
            min-width: 6.5rem;
            border-radius: 0.6rem;
        }
        .pt-batches-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--pt-link);
            background-color: var(--pt-tint);
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.15rem 0.55rem;
            border-radius: 999px;
            border: 0;
        }
        .pt-batches-toggle:hover,
        .pt-batches-toggle:focus-visible {
            background-color: var(--pt-sky);
            color: var(--pt-text);
        }
        .pt-chev {
            transition: transform 0.18s ease;
        }
        .pt-batches-toggle:not(.collapsed) .pt-chev {
            transform: rotate(180deg);
        }
        .pt-undo-toast {
            position: fixed;
            right: 1.25rem;
            bottom: 1.25rem;
            z-index: 1080;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            max-width: calc(100vw - 2.5rem);
            padding: 0.6rem 0.75rem 0.6rem 1rem;
            background-color: var(--pt-text);
            color: var(--pt-white);
            border-radius: 0.75rem;
            box-shadow: 0 8px 24px rgba(31, 42, 36, 0.28);
        }
        .pt-undo-icon {
            color: var(--pt-mint);
        }
        .pt-undo-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pt-undo-close {
            filter: invert(1) grayscale(1) brightness(2);
        }
        @media (prefers-reduced-motion: reduce) {
            .pt-chev,
            .pt-drawer,
            .pt-nav a {
                transition: none;
            }
        }
        .pt-stat-soon {
            color: #9A6400;
        }
        .pt-stat-warning {
            color: var(--pt-warning);
        }
        .pt-loc-link {
            color: var(--pt-text);
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 0.7rem;
            border-radius: 0.55rem;
            transition: background-color 0.15s ease, color 0.15s ease;
        }
        .pt-loc-link:hover {
            background-color: var(--pt-tint);
            color: var(--pt-text);
        }
        .pt-loc-link.active {
            background-color: var(--pt-primary);
            color: var(--pt-on-primary);
            font-weight: 600;
        }
        .pt-loc-link.active .pt-loc-count {
            background-color: var(--pt-white);
            color: var(--pt-text);
        }
        .pt-item-row {
            background-color: var(--pt-row);
            border: 1px solid var(--pt-line);
        }
        .table {
            --bs-table-bg: transparent;
        }
        .pt-qty {
            display: inline-flex;
            align-items: stretch;
            border: 1px solid var(--bs-secondary);
            border-radius: var(--bs-border-radius-sm);
            overflow: hidden;
        }
        .pt-qty > .btn {
            border: 0;
            border-radius: 0;
        }
        .pt-qty .pt-qty-value,
        .pt-qty .pt-qty-input {
            border: 0;
            border-left: 1px solid var(--bs-secondary);
            border-right: 1px solid var(--bs-secondary);
        }
        .pt-qty-input {
            width: 2.8rem;
            background-color: #fff;
            color: var(--pt-text);
            font-weight: 600;
            text-align: center;
            -moz-appearance: textfield;
            appearance: textfield;
        }
        .pt-qty-input::-webkit-inner-spin-button,
        .pt-qty-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .pt-qty-input:focus {
            outline: none;
            box-shadow: inset 0 0 0 2px rgba(47, 125, 79, 0.45);
        }
        .pt-cart-menu {
            min-width: 11rem;
            background-color: var(--pt-white);
            border-color: var(--pt-line);
        }
        .pt-badge-today {
            background-color: var(--pt-warning);
            font-weight: 700;
        }
        .pt-badge-expired {
            background-color: var(--pt-expired);
            font-weight: 700;
        }
        .pt-qty .pt-qty-value {
            min-width: 2.8rem;
            background-color: #fff;
            color: var(--pt-text);
            font-weight: 600;
            opacity: 1;
        }
        .pt-expiring-list li {
            padding: 0.6rem 0;
            border-top: 1px solid var(--pt-line);
        }
        .pt-expiring-list li:first-child {
            border-top: 0;
            padding-top: 0;
        }
        .pt-one-group .pt-group-card:not(.pt-active) {
            display: none;
        }
        .pt-group-card {
            scroll-margin-top: calc(var(--pt-topbar-h) + 1rem);
        }
        .pt-main:has(> .pt-home) {
            padding: 0;
        }
        .pt-home {
            display: flex;
            align-items: flex-start;
            min-height: calc(100vh - var(--pt-topbar-h));
        }
        .pt-home-side {
            width: 380px;
            flex-shrink: 0;
            position: sticky;
            top: var(--pt-topbar-h);
            height: calc(100vh - var(--pt-topbar-h));
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow: hidden;
            padding: 1.6rem 0.5rem 1.6rem 1.9rem;
        }
        .pt-home-main {
            flex: 1 1 auto;
            min-width: 0;
            padding: 1.6rem 1.9rem 1.6rem 0.5rem;
        }
        @media (max-width: 991.98px) {
            .pt-home {
                flex-direction: column;
                align-items: stretch;
            }
            .pt-home-side {
                width: auto;
                position: static;
                height: auto;
                overflow: visible;
                padding: 1.1rem 1.1rem 0;
            }
            .pt-side-card {
                flex: none;
            }
            .pt-side-scroll {
                max-height: 16rem;
            }
            .pt-home-main {
                padding: 1.1rem;
            }
        }
        .pt-expiry {
            color: var(--pt-text);
            opacity: 0.75;
            white-space: nowrap;
        }
        .pt-expiry-past {
            color: var(--pt-warning);
            opacity: 1;
            font-weight: 600;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .pt-topbar {
            background-color: var(--pt-sky);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.7rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 1030;
            box-shadow: 0 1px 4px rgba(31, 42, 36, 0.10);
        }
        .pt-brand {
            font-weight: 700;
            font-size: 1.25rem;
            color: #28452F;
            text-decoration: none;
            letter-spacing: -0.01em;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .pt-brand:hover,
        .pt-brand:focus-visible {
            color: #28452F;
        }
        .pt-logo {
            height: 2rem;
            width: auto;
        }
        .pt-topbar-right {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.9rem;
            min-width: 0;
        }
        .pt-topbar-right .pt-user {
            max-width: 16rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pt-topbar-left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            align-self: stretch;
        }
        .pt-menu {
            align-self: stretch;
            display: flex;
            align-items: center;
            margin: -0.7rem 0;
            padding: 0.7rem 0;
        }
        .pt-menu-btn {
            background: none;
            border: 0;
            color: var(--pt-text);
            font-size: 1.5rem;
            line-height: 1;
            padding: 0.25rem 0.45rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .pt-menu-btn:hover,
        .pt-menu-btn:focus-visible,
        .pt-menu.open .pt-menu-btn {
            background-color: rgba(255, 255, 255, 0.55);
        }
        .pt-drawer {
            position: absolute;
            top: 100%;
            left: 0;
            width: 236px;
            height: calc(100vh - 100%);
            background-color: var(--pt-sky);
            box-shadow: 4px 0 14px rgba(31, 42, 36, 0.16);
            padding: 1.2rem 0.8rem;
            transform: translateX(-100%);
            visibility: hidden;
            transition: transform 0.22s ease, visibility 0s linear 0.22s;
        }
        .pt-menu:hover .pt-drawer,
        .pt-menu:focus-within .pt-drawer,
        .pt-menu.open .pt-drawer {
            transform: translateX(0);
            visibility: visible;
            transition: transform 0.22s ease, visibility 0s;
        }
        .pt-nav {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .pt-nav a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.65rem 0.95rem;
            border-radius: 0.65rem;
            color: var(--pt-text);
            text-decoration: none;
            font-weight: 500;
            line-height: 1.1;
            white-space: nowrap;
            transition: background-color 0.15s ease, transform 0.12s ease, color 0.15s ease;
        }
        .pt-nav a .bi {
            font-size: 1.15rem;
            width: 1.3rem;
            text-align: center;
        }
        .pt-nav a:hover {
            background-color: rgba(255, 255, 255, 0.6);
            color: var(--pt-text);
            transform: translateX(3px);
        }
        .pt-nav a.active {
            background-color: var(--pt-primary);
            color: var(--pt-on-primary);
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(31, 42, 36, 0.16);
        }
        .pt-nav a.active:hover {
            transform: none;
            background-color: var(--pt-primary);
            color: var(--pt-on-primary);
        }
        .pt-main {
            flex: 1 1 auto;
            min-width: 0;
            padding: 1.6rem 1.9rem;
        }
        @media (max-width: 767.98px) {
            .pt-topbar {
                padding: 0.7rem 1rem;
            }
            .pt-topbar-right .pt-user {
                display: none;
            }
            .pt-nav a:hover {
                transform: none;
            }
            .pt-main {
                padding: 1.1rem;
            }
        }
    </style>
</head>
<body>
<header class="pt-topbar">
    <div class="pt-topbar-left">
        <div class="pt-menu" sec:authorize="isAuthenticated()">
            <button type="button" class="pt-menu-btn" aria-label="Menu" aria-expanded="false"
                    aria-controls="pt-drawer"><i class="bi bi-list"></i></button>
            <aside class="pt-drawer" id="pt-drawer">
                <nav class="pt-nav">
                    <a th:href="@{/}"><i class="bi bi-house"></i> Home</a>
                    <a th:href="@{/grocery}"><i class="bi bi-cart3"></i> Grocery</a>
                    <a th:href="@{/categories}"><i class="bi bi-tags"></i> Categories</a>
                </nav>
            </aside>
        </div>
        <a class="pt-brand" th:href="@{/}"><img class="pt-logo" th:src="@{/img/logo.png}" alt="">Pantry Tracker</a>
    </div>
    <div class="pt-topbar-right" sec:authorize="isAuthenticated()">
        <span class="pt-user" sec:authentication="name">user@example.com</span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-sm btn-outline-dark">Log out</button>
        </form>
    </div>
</header>
<main class="pt-main">
    <div layout:fragment="content"></div>
</main>
<script>
    document.body.addEventListener('htmx:configRequest', function (event) {
        var token = document.querySelector('meta[name="_csrf"]');
        var header = document.querySelector('meta[name="_csrf_header"]');
        if (token && header) {
            event.detail.headers[header.getAttribute('content')] = token.getAttribute('content');
        }
    });

    function ptApplyAutoCalc(checkbox) {
        var form = checkbox.form || checkbox.closest('form');
        if (!form) {
            return;
        }
        var dateInput = form.elements['expirationDate'];
        if (dateInput) {
            dateInput.disabled = checkbox.checked;
        }
    }

    function ptSyncAllAutoCalc() {
        document.querySelectorAll('.pt-autocalc').forEach(ptApplyAutoCalc);
    }

    function ptMarkActiveNav() {
        var path = window.location.pathname;
        document.querySelectorAll('.pt-nav a').forEach(function (a) {
            var href = a.getAttribute('href');
            var active = href === path || (href !== '/' && path.indexOf(href) === 0);
            a.classList.toggle('active', active);
        });
    }

    function ptSyncTopbarHeight() {
        var bar = document.querySelector('.pt-topbar');
        if (bar) {
            document.documentElement.style.setProperty('--pt-topbar-h', bar.offsetHeight + 'px');
        }
    }

    ptSyncTopbarHeight();
    window.addEventListener('resize', ptSyncTopbarHeight);
    window.addEventListener('load', ptSyncTopbarHeight);

    function ptGroupIdFromHash() {
        var match = window.location.hash.match(/^#group-card-(\d+)$/);
        return match ? match[1] : null;
    }

    function ptShowGroup(id) {
        var cards = Array.prototype.slice.call(document.querySelectorAll('.pt-group-card'));
        if (!cards.length) {
            return;
        }
        var target = cards.filter(function (c) { return c.dataset.groupId === String(id); })[0] || cards[0];
        var activeId = target.dataset.groupId;
        document.querySelector('.pt-home').classList.add('pt-one-group');
        cards.forEach(function (c) { c.classList.toggle('pt-active', c === target); });
        document.querySelectorAll('.pt-loc-link').forEach(function (a) {
            a.classList.toggle('active', a.dataset.groupId === activeId);
        });
        try {
            localStorage.setItem('pt-group', activeId);
        } catch (e) {
        }
    }

    function ptInitGroups() {
        if (!document.querySelector('.pt-group-card')) {
            return;
        }
        var id = ptGroupIdFromHash();
        if (!id) {
            try {
                id = localStorage.getItem('pt-group');
            } catch (e) {
            }
        }
        ptShowGroup(id);
        if (ptGroupIdFromHash()) {
            window.scrollTo(0, 0);
        }
    }

    document.addEventListener('click', function (event) {
        var link = event.target.closest('.pt-loc-link');
        if (!link) {
            return;
        }
        event.preventDefault();
        history.replaceState(null, '', '#group-card-' + link.dataset.groupId);
        ptShowGroup(link.dataset.groupId);
    });

    window.addEventListener('hashchange', function () {
        var id = ptGroupIdFromHash();
        if (id) {
            ptShowGroup(id);
        }
    });

    document.body.addEventListener('htmx:afterSwap', function (event) {
        var target = event.detail && event.detail.target;
        if (!target || !target.id || target.id.indexOf('group-body-') !== 0) {
            return;
        }
        var groupId = target.id.substring('group-body-'.length);
        var link = document.querySelector('.pt-loc-link[data-group-id="' + groupId + '"] .pt-loc-count');
        if (link) {
            link.textContent = target.querySelectorAll('.pt-item-row').length;
        }
    });

    function ptSetMenu(open) {
        var menu = document.querySelector('.pt-menu');
        if (!menu) {
            return;
        }
        var btn = menu.querySelector('.pt-menu-btn');
        menu.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (!open && menu.contains(document.activeElement)) {
            document.activeElement.blur();
        }
    }

    document.addEventListener('click', function (event) {
        var menu = document.querySelector('.pt-menu');
        if (!menu) {
            return;
        }
        if (event.target.closest('.pt-menu-btn')) {
            ptSetMenu(!menu.classList.contains('open'));
        } else if (!menu.contains(event.target)) {
            ptSetMenu(false);
        }
    });

    document.addEventListener('click', function (event) {
        var step = event.target.closest('.pt-step');
        if (!step) {
            return;
        }
        var input = step.parentElement.querySelector('.pt-qty-input');
        var current = parseInt(input.value, 10) || 1;
        input.value = Math.max(1, current + parseInt(step.dataset.step, 10));
    });

    document.addEventListener('click', function (event) {
        var link = event.target.closest('.pt-exp-link');
        if (!link) {
            return;
        }
        event.preventDefault();
        history.replaceState(null, '', '#group-card-' + link.dataset.groupId);
        ptShowGroup(link.dataset.groupId);
        var row = document.getElementById('item-row-' + link.dataset.itemId);
        if (!row) {
            return;
        }
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        row.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
        if (!reduce) {
            row.classList.remove('pt-flash');
            void row.offsetWidth;
            row.classList.add('pt-flash');
        }
    });

    document.addEventListener('input', function (event) {
        if (event.target.id !== 'loc-search') {
            return;
        }
        var term = event.target.value.trim().toLowerCase();
        var shown = 0;
        document.querySelectorAll('#loc-list > li').forEach(function (li) {
            var name = li.querySelector('.pt-loc-name').textContent.toLowerCase();
            var match = name.indexOf(term) !== -1;
            li.hidden = !match;
            if (match) {
                shown++;
            }
        });
        var none = document.getElementById('loc-no-match');
        if (none) {
            none.hidden = shown > 0;
        }
    });

    document.addEventListener('shown.bs.collapse', function (event) {
        var field = event.target.querySelector('input');
        if (field && (event.target.id === 'loc-search-box' || event.target.id === 'new-location')) {
            field.focus();
        }
    });

    function ptSyncPutAway() {
        var picks = Array.prototype.slice.call(document.querySelectorAll('.pt-pick:not(:disabled)'));
        var btn = document.getElementById('put-away-btn');
        if (!btn) {
            return;
        }
        var checked = picks.filter(function (p) { return p.checked; }).length;
        document.getElementById('put-away-count').textContent = checked;
        btn.disabled = checked === 0;
        var all = document.getElementById('pick-all');
        all.checked = picks.length > 0 && checked === picks.length;
        all.indeterminate = checked > 0 && checked < picks.length;
    }

    function ptFilterQuickAdd() {
        var field = document.getElementById('quick-search');
        if (!field) {
            return;
        }
        var term = field.value.trim().toLowerCase();
        var shown = 0;
        document.querySelectorAll('#quick-list > li').forEach(function (li) {
            var match = li.querySelector('.pt-quick-name').textContent.toLowerCase().indexOf(term) !== -1;
            li.hidden = !match;
            if (match) {
                shown++;
            }
        });
        var none = document.getElementById('quick-no-match');
        if (none) {
            none.hidden = shown > 0 || !document.getElementById('quick-list');
        }
    }

    document.addEventListener('change', function (event) {
        if (event.target.id === 'pick-all') {
            document.querySelectorAll('.pt-pick:not(:disabled)').forEach(function (p) {
                p.checked = event.target.checked;
            });
        }
        if (event.target.id === 'pick-all' || event.target.classList.contains('pt-pick')) {
            ptSyncPutAway();
        }
    });

    document.addEventListener('input', function (event) {
        if (event.target.id === 'quick-search') {
            ptFilterQuickAdd();
        }
    });

    var ptGroceryState = null;

    document.body.addEventListener('htmx:beforeSwap', function (event) {
        if (event.detail.target.id !== 'grocery-body') {
            return;
        }
        var search = document.getElementById('quick-search');
        ptGroceryState = {
            picked: Array.prototype.map.call(document.querySelectorAll('.pt-pick:checked'), function (p) { return p.value; }),
            search: search ? search.value : '',
            focus: search === document.activeElement
        };
    });

    document.body.addEventListener('htmx:afterSwap', function (event) {
        if (event.detail.target.id !== 'grocery-body' || !ptGroceryState) {
            return;
        }
        ptGroceryState.picked.forEach(function (id) {
            var box = document.getElementById('pick-' + id);
            if (box && !box.disabled) {
                box.checked = true;
            }
        });
        var search = document.getElementById('quick-search');
        if (search) {
            search.value = ptGroceryState.search;
            if (ptGroceryState.focus) {
                search.focus();
            }
        }
        ptGroceryState = null;
        ptFilterQuickAdd();
        ptSyncPutAway();
    });

    var ptToastTimer = null;

    function ptShowToast(toast) {
        if (!toast) {
            return;
        }
        document.querySelectorAll('.pt-undo-toast').forEach(function (t) {
            if (t !== toast) {
                t.remove();
            }
        });
        document.body.appendChild(toast);
        clearTimeout(ptToastTimer);
        ptToastTimer = setTimeout(function () { toast.remove(); }, 12000);
    }

    document.addEventListener('DOMContentLoaded', function () {
        var toasts = document.querySelectorAll('.pt-undo-toast');
        ptShowToast(toasts[toasts.length - 1]);
    });

    document.body.addEventListener('htmx:afterSwap', function (event) {
        var target = event.detail && event.detail.target;
        if (target && target.querySelector) {
            ptShowToast(target.querySelector('.pt-undo-toast'));
        }
    });

    document.addEventListener('click', function (event) {
        var close = event.target.closest('.pt-undo-close');
        if (close) {
            close.closest('.pt-undo-toast').remove();
        }
    });

    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
            ptSetMenu(false);
        }
    });

    document.addEventListener('change', function (event) {
        if (event.target.classList.contains('pt-autocalc')) {
            ptApplyAutoCalc(event.target);
        }
    });

    document.addEventListener('DOMContentLoaded', function () {
        ptSyncAllAutoCalc();
        ptMarkActiveNav();
        ptInitGroups();
        ptSyncPutAway();
    });
    document.body.addEventListener('htmx:afterSwap', ptSyncAllAutoCalc);

    document.body.addEventListener('htmx:afterOnLoad', function (event) {
        var el = event.detail && event.detail.elt;
        if (!el || !el.closest) {
            return;
        }
        var modalEl = el.closest('.modal');
        if (modalEl && window.bootstrap) {
            bootstrap.Modal.getOrCreateInstance(modalEl).hide();
            var form = modalEl.querySelector('form');
            if (form) {
                form.reset();
            }
            ptSyncAllAutoCalc();
        }
    });
</script>
</body>
</html>
