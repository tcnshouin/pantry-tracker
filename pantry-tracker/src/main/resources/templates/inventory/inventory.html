<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title>Inventory</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="h3 mb-3">Inventory</h1>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-secondary" th:if="${undone}">
        Undone: <span th:text="${undone}">action</span>
    </div>

    <div id="undo-slot">
        <form th:if="${undoLabel}" th:action="@{/undo}" method="post" class="mb-3">
            <button type="submit" class="btn btn-sm btn-outline-dark">
                ↶ Undo: <span th:text="${undoLabel}">last action</span>
            </button>
        </form>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/locations}" method="post" class="row g-2 align-items-end">
                <div class="col-sm-8">
                    <label for="new-group-name" class="form-label fw-semibold">Create group</label>
                    <input type="text" id="new-group-name" name="name" class="form-control"
                           placeholder="e.g. Pantry shelf" required>
                </div>
                <div class="col-sm-4 d-grid">
                    <button type="submit" class="btn btn-pt">Create group</button>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${groups.isEmpty()}" class="text-muted">
        No groups yet. Create one above to start adding items.
    </div>

    <div th:each="g : ${groups}" class="card shadow-sm mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
            <button class="btn btn-link text-decoration-none fw-semibold p-0" type="button"
                    data-bs-toggle="collapse" th:data-bs-target="'#collapse-' + ${g.group().id()}">
                <span th:text="${g.group().name()}">Group</span>
            </button>
            <div class="d-flex gap-2">
                <form th:action="@{/locations/{id}/rename(id=${g.group().id()})}" method="post"
                      class="d-flex gap-1">
                    <input type="text" name="name" class="form-control form-control-sm"
                           th:value="${g.group().name()}" style="max-width: 12rem;">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">Rename</button>
                </form>
                <form th:action="@{/locations/{id}/delete(id=${g.group().id()})}" method="post"
                      onsubmit="return confirm('Delete this group?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </div>
        </div>
        <div th:id="'collapse-' + ${g.group().id()}" class="collapse show">
            <div class="card-body">
                <div th:id="'group-body-' + ${g.group().id()}">
                    <div th:replace="~{inventory/fragments :: groupBody(${g.group()}, ${g.items()}, ${categories}, null, null)}"></div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
