services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pantry
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pantry}
    volumes:
      - pantry-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantry -d pantry"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/pantry
      DB_USERNAME: pantry
      DB_PASSWORD: ${DB_PASSWORD:-pantry}
    ports:
      - "8080:8080"

volumes:
  pantry-db-data:
