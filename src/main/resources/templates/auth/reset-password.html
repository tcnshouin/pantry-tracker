<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title>Choose a new password</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h4 mb-3">Choose a new password</h1>

                    <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>
                    <div class="alert alert-danger" id="reset-link-error" hidden></div>

                    <form th:action="@{/reset-password}" method="post" id="reset-form">
                        <input type="hidden" name="accessToken" id="access-token" th:value="${accessToken}">
                        <div class="mb-3">
                            <label for="password" class="form-label">New password</label>
                            <input type="password" id="password" name="password" class="form-control" required
                                   minlength="8" autocomplete="new-password" data-pw-rules>
                            <ul class="pw-rules" data-pw-rules-for="password" aria-live="polite">
                                <li data-rule="length"><i class="bi bi-circle"></i> At least 8 characters</li>
                                <li data-rule="letter"><i class="bi bi-circle"></i> A letter</li>
                                <li data-rule="number"><i class="bi bi-circle"></i> A number</li>
                                <li data-rule="symbol"><i class="bi bi-circle"></i> A symbol (! @ # $)</li>
                            </ul>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm new password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                                   required minlength="8" autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-pt w-100">Save new password</button>
                    </form>

                    <p class="mt-3 mb-0 text-center">
                        <a th:href="@{/forgot-password}">Request a new link</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function () {
            var hash = new URLSearchParams(window.location.hash.substring(1));
            var token = hash.get('access_token');
            if (token) {
                document.getElementById('access-token').value = token;
                history.replaceState(null, '', window.location.pathname);
            }
            var problem = hash.get('error_description');
            if (problem) {
                var box = document.getElementById('reset-link-error');
                box.textContent = problem.replace(/\+/g, ' ') + '. Request a new link.';
                box.hidden = false;
            }
        })();
    </script>
</div>
</body>
</html>
