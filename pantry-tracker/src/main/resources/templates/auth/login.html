<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title>Log in</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h4 mb-3">Log in</h1>

                    <div class="alert alert-success" th:if="${param.registered}">
                        Account created. Please log in.
                    </div>
                    <div class="alert alert-secondary" th:if="${param.logout}">
                        You have been logged out.
                    </div>
                    <div class="alert alert-danger" th:if="${param.error}">
                        Invalid email or password.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Email</label>
                            <input type="email" id="username" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-pt w-100">Log in</button>
                    </form>

                    <p class="mt-3 mb-0 text-center">
                        No account? <a th:href="@{/register}">Create one</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
