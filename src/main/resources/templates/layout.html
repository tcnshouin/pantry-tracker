<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title layout:title-pattern="$CONTENT_TITLE · Pantry Tracker">Pantry Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.3/dist/htmx.min.js" defer></script>
    <style>
        :root {
            --pt-accent: #DB9558;
            --pt-bg: #FCF9EA;
            --pt-fresh: #97A87A;
            --pt-surface: #A8BBA3;
            --pt-text: #3A342B;
            --pt-warning: #C0562F;
        }
        body {
            background-color: var(--pt-bg);
            color: var(--pt-text);
        }
        .navbar-pt {
            background-color: var(--pt-surface);
        }
        .navbar-pt .navbar-brand,
        .navbar-pt .nav-link,
        .navbar-pt .navbar-text {
            color: var(--pt-text);
        }
        .btn-pt {
            background-color: var(--pt-accent);
            border-color: var(--pt-accent);
            color: var(--pt-bg);
        }
        .btn-pt:hover,
        .btn-pt:focus {
            background-color: var(--pt-warning);
            border-color: var(--pt-warning);
            color: var(--pt-bg);
        }
        a {
            color: var(--pt-accent);
        }
        .card {
            background-color: var(--pt-bg);
            border-color: var(--pt-surface);
        }
        .pt-badge {
            color: var(--pt-bg);
        }
        .pt-badge-warning {
            background-color: var(--pt-warning);
        }
        .pt-badge-accent {
            background-color: var(--pt-accent);
        }
        .pt-badge-fresh {
            background-color: var(--pt-fresh);
        }
        .pt-badge-muted {
            background-color: var(--pt-surface);
            color: var(--pt-text);
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-pt shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Pantry Tracker</a>
        <div class="d-flex align-items-center gap-3">
            <a class="nav-link" th:href="@{/inventory}" sec:authorize="isAuthenticated()">Inventory</a>
            <a class="nav-link" th:href="@{/categories}" sec:authorize="isAuthenticated()">Categories</a>
            <span class="navbar-text" sec:authorize="isAuthenticated()"
                  sec:authentication="name">user@example.com</span>
            <form th:action="@{/logout}" method="post" class="m-0" sec:authorize="isAuthenticated()">
                <button type="submit" class="btn btn-sm btn-outline-dark">Log out</button>
            </form>
        </div>
    </div>
</nav>
<main class="container py-4">
    <div layout:fragment="content"></div>
</main>
<script>
    document.body.addEventListener('htmx:configRequest', function (event) {
        var token = document.querySelector('meta[name="_csrf"]');
        var header = document.querySelector('meta[name="_csrf_header"]');
        if (token && header) {
            event.detail.headers[header.getAttribute('content')] = token.getAttribute('content');
        }
    });

    function ptApplyAutoCalc(checkbox) {
        var form = checkbox.form || checkbox.closest('form');
        if (!form) {
            return;
        }
        var dateInput = form.elements['expirationDate'];
        if (dateInput) {
            dateInput.disabled = checkbox.checked;
        }
    }

    function ptSyncAllAutoCalc() {
        document.querySelectorAll('.pt-autocalc').forEach(ptApplyAutoCalc);
    }

    document.addEventListener('change', function (event) {
        if (event.target.classList.contains('pt-autocalc')) {
            ptApplyAutoCalc(event.target);
        }
    });

    document.addEventListener('DOMContentLoaded', ptSyncAllAutoCalc);
    document.body.addEventListener('htmx:afterSwap', ptSyncAllAutoCalc);
</script>
</body>
</html>
