<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title>Forgot password</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h4 mb-3">Forgot password</h1>

                    <div class="alert alert-success" th:if="${sent}">
                        If an account exists for that email, a reset link is on its way. Check your inbox.
                    </div>
                    <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>

                    <p class="text-muted small">Enter your email and we'll send you a link to choose a new password.</p>
                    <form th:action="@{/forgot-password}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email" class="form-control" required autofocus
                                   autocomplete="email">
                        </div>
                        <button type="submit" class="btn btn-pt w-100">Send reset link</button>
                    </form>

                    <p class="mt-3 mb-0 text-center">
                        <a th:href="@{/login}">Back to log in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
