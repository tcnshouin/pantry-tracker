<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<div th:fragment="categorySelect(options, fieldName)" class="dropdown pt-category-select">
    <input type="hidden" th:name="${fieldName}" class="pt-category-value">
    <button class="btn btn-outline-dark dropdown-toggle w-100 text-start pt-category-toggle"
            type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
        Choose a category
    </button>
    <div class="dropdown-menu w-100 p-2" style="max-height: 320px; overflow-y: auto;">
        <input type="text" class="form-control form-control-sm mb-2 pt-category-search"
               placeholder="Search categories">
        <ul class="list-unstyled mb-0 pt-category-list">
            <li th:each="opt : ${options}">
                <button type="button"
                        class="dropdown-item d-flex justify-content-between align-items-center pt-category-item"
                        th:data-id="${opt.id()}" th:data-name="${opt.name()}">
                    <span th:text="${opt.name()}">Category</span>
                    <span class="badge rounded-pill text-bg-light ms-2"
                          th:text="'~' + ${opt.shelfLifeDays()} + ' d'">~0 d</span>
                </button>
            </li>
            <li class="pt-category-empty text-muted small px-2 py-1 d-none">No matches</li>
        </ul>
    </div>
</div>
<script th:fragment="categorySelectScript">
    document.querySelectorAll('.pt-category-select').forEach(function (root) {
        var search = root.querySelector('.pt-category-search');
        var items = Array.prototype.slice.call(root.querySelectorAll('.pt-category-item'));
        var empty = root.querySelector('.pt-category-empty');
        var value = root.querySelector('.pt-category-value');
        var toggle = root.querySelector('.pt-category-toggle');
        if (search) {
            search.addEventListener('input', function () {
                var q = search.value.trim().toLowerCase();
                var visible = 0;
                items.forEach(function (item) {
                    var match = item.dataset.name.toLowerCase().indexOf(q) !== -1;
                    item.parentElement.classList.toggle('d-none', !match);
                    if (match) {
                        visible++;
                    }
                });
                if (empty) {
                    empty.classList.toggle('d-none', visible !== 0);
                }
            });
        }
        items.forEach(function (item) {
            item.addEventListener('click', function () {
                value.value = item.dataset.id;
                toggle.textContent = item.dataset.name;
            });
        });
    });
</script>
</body>
</html>
